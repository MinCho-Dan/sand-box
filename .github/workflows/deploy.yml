name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            isekai-kimdaewon/package-lock.json
            clockout-defense/package-lock.json

      - name: Install (isekai-kimdaewon)
        working-directory: isekai-kimdaewon
        run: npm ci

      - name: Test (isekai-kimdaewon)
        working-directory: isekai-kimdaewon
        run: npm test

      - name: Build (isekai-kimdaewon)
        working-directory: isekai-kimdaewon
        run: npm run build

      - name: Install (clockout-defense)
        working-directory: clockout-defense
        run: npm ci

      - name: Build (clockout-defense)
        working-directory: clockout-defense
        run: npm run build

      # 사이트 조립: 루트 랜딩 페이지 + 각 프로젝트 빌드 결과
      - name: Assemble site
        run: |
          mkdir -p _site/isekai-kimdaewon
          mkdir -p _site/clockout-defense
          cp site/index.html _site/index.html
          cp -r isekai-kimdaewon/dist/* _site/isekai-kimdaewon/
          cp -r clockout-defense/dist/* _site/clockout-defense/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
