<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#07090a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="단기 4361년, 인류의 마지막 생존자 김대원의 이세계 전이 액션 게임.">
<title>이세계전사 김대원</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    position: fixed; inset: 0;
    background: #07090a;
    display: flex; align-items: center; justify-content: center;
    font-family: "Malgun Gothic", "맑은 고딕", "Apple SD Gothic Neo", sans-serif;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  /* 9:16.2 세로 비율.
     vh 는 모바일 주소창 때문에 실제 보이는 높이보다 커서 화면이 잘리고,
     aspect-ratio 만으로도 height 가 확정되면 max-width 클램프가 비율을 깨뜨린다.
     -> 최종 크기는 main.ts 의 fitCanvas() 가 픽셀로 직접 지정한다. 아래는 폴백. */
  #wrap {
    position: relative;
    aspect-ratio: 540 / 972;
    max-width: 100%; max-height: 100%;
    container-type: inline-size;
    touch-action: none;
  }
  canvas {
    display: block;
    width: 100%; height: 100%;
    background: #0b0f10;
    box-shadow: 0 0 60px rgba(60, 220, 160, .09);
    touch-action: none;
  }

  /* ── 터치 컨트롤 ── */
  #touch { display: none; }
  body.touch #touch { display: block; }
  body:not(.playing) .btn { display: none; }
  #touch > * { position: absolute; z-index: 5; }

  #stick { inset: 0; width: 100%; height: 100%; opacity: 0; transition: opacity .12s; pointer-events: none; }
  #stick.on { opacity: 1; }
  #stick .base, #stick .knob { position: absolute; border-radius: 50%; transform: translate(-50%, -50%); }
  #stick .base {
    width: 20cqw; height: 20cqw;
    border: 2px solid rgba(143, 227, 192, .3);
    background: rgba(10, 24, 20, .32);
  }
  #stick .knob {
    width: 9.6cqw; height: 9.6cqw;
    background: rgba(143, 227, 192, .46);
    border: 2px solid rgba(223, 243, 255, .55);
  }

  .btn {
    position: absolute;
    aspect-ratio: 1;
    border-radius: 50%;
    border: 2px solid rgba(143, 227, 192, .4);
    background: rgba(18, 34, 28, .46);
    color: #cfe8dd;
    font-family: inherit; font-weight: bold; font-size: 14px;
    display: flex; align-items: center; justify-content: center;
    touch-action: none;
  }
  .btn.press { background: rgba(143, 227, 192, .45); color: #06110d; }
  #btnAtk  { right: 5%;  bottom: calc(8% + env(safe-area-inset-bottom, 0px)); width: 25%; }
  #btnDash { right: 33%; bottom: calc(4% + env(safe-area-inset-bottom, 0px)); width: 18%; }
  @container (min-width: 1px) { .btn { font-size: 4.2cqw; } }

  /* ── 랭킹 등록 폼 ── */
  #rankform {
    display: none;
    position: fixed; inset: 0; z-index: 30;
    background: rgba(4, 7, 6, .82);
    align-items: center; justify-content: center;
    padding: 20px;
  }
  body.asknick #rankform { display: flex; }
  #rankform .box {
    width: 100%; max-width: 320px;
    background: #0d1513; border: 1px solid #24443a; border-radius: 10px;
    padding: 22px 20px; text-align: center;
  }
  #rankform h2 { color: #8fe3c0; font-size: 18px; margin: 0 0 4px; }
  #rankform .sub { color: #5d7a70; font-size: 12px; margin-bottom: 16px; }
  #rankform input {
    width: 100%; padding: 12px 14px; margin-bottom: 14px;
    background: #060b0a; border: 1px solid #2c5548; border-radius: 6px;
    color: #cfe8dd; font-family: inherit; font-size: 16px; text-align: center;
    -webkit-user-select: text; user-select: text;
  }
  #rankform input:focus { outline: none; border-color: #8fe3c0; }
  #rankform .row { display: flex; gap: 10px; }
  #rankform button {
    flex: 1; padding: 12px; border-radius: 6px; cursor: pointer;
    font-family: inherit; font-size: 14px; font-weight: bold;
    border: 1px solid #2c5548; background: #101d1a; color: #7fbfa6;
  }
  #rankform button.go { background: rgba(143,227,192,.16); border-color: #8fe3c0; color: #8fe3c0; }
  #rankform button[disabled] { opacity: .5; cursor: default; }
  #rankform .msg { color: #ff8a8a; font-size: 12px; min-height: 16px; margin-top: 10px; }

  /* ── 데스크톱 사이드 안내 ── */
  #side {
    display: none;
    position: fixed; right: 28px; top: 50%; transform: translateY(-50%);
    width: 250px; color: #4d6b61; font-size: 13px; line-height: 1.85;
  }
  #side h1 { color: #8fe3c0; font-size: 17px; margin: 0 0 4px; letter-spacing: .5px; }
  #side .k { color: #cfe8dd; font-weight: bold; }
  #side hr { border: 0; border-top: 1px solid #1a2622; margin: 14px 0; }
  @media (min-width: 900px) { body:not(.touch) #side { display: block; } }
</style>
</head>
<body>

<div id="wrap">
  <canvas id="cv" width="540" height="972"></canvas>
  <div id="touch">
    <div id="stick"><div class="base"></div><div class="knob"></div></div>
    <div class="btn" id="btnDash">회피</div>
    <div class="btn" id="btnAtk">공격</div>
  </div>
</div>

<div id="rankform">
  <div class="box">
    <h2>랭킹 등록</h2>
    <div class="sub" id="rf-sub">점수를 남기시겠습니까?</div>
    <input id="rf-nick" maxlength="12" placeholder="닉네임" autocomplete="off" spellcheck="false">
    <div class="row">
      <button id="rf-skip">건너뛰기</button>
      <button id="rf-go" class="go">등록</button>
    </div>
    <div class="msg" id="rf-msg"></div>
  </div>
</div>

<div id="side">
  <h1>이세계전사 김대원</h1>
  단기 4361년 · 인류의 마지막 생존자
  <hr>
  이동 <span class="k">WASD</span> / <span class="k">방향키</span><br>
  공격 <span class="k">J</span> 또는 <span class="k">Space</span><br>
  회피 <span class="k">K</span> 또는 <span class="k">Shift</span><br>
  진행 <span class="k">Enter</span><br>
  음소거 <span class="k">M</span>
  <hr>
  허기가 0이 되면 체력이 깎인다.<br>
  회피는 허기를 소모한다.<br>
  탄막은 렌치로 쳐낼 수 있다.
</div>

<script type="module" src="./src/main.ts"></script>
</body>
</html>
