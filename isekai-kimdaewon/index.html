<title>이세계전사 김대원</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    position: fixed; inset: 0;
    background: #07090a;
    display: flex; align-items: center; justify-content: center;
    font-family: "Malgun Gothic", "맑은 고딕", "Apple SD Gothic Neo", sans-serif;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  /* 9:16.2 세로 비율 유지.
     vh 는 모바일 주소창 때문에 실제 보이는 높이보다 커서 화면이 잘린다.
     aspect-ratio 만으로도 height 가 확정되면 max-width 클램프가 비율을 깨뜨린다.
     -> 최종 크기는 fitCanvas() 가 픽셀로 직접 지정한다. 아래는 JS 실행 전 폴백. */
  #wrap {
    position: relative;
    aspect-ratio: 540 / 972;
    max-width: 100%; max-height: 100%;
    container-type: inline-size;
    touch-action: none;
  }
  canvas {
    display: block;
    width: 100%; height: 100%;
    background: #0b0f10;
    box-shadow: 0 0 60px rgba(60, 220, 160, .09);
    touch-action: none;
  }

  /* ── 터치 컨트롤 ── */
  #touch { display: none; }
  body.touch #touch { display: block; }
  body:not(.playing) .btn { display: none; }
  #touch > * { position: absolute; z-index: 5; }

  #stick { inset: 0; width: 100%; height: 100%; opacity: 0; transition: opacity .12s; pointer-events: none; }
  #stick.on { opacity: 1; }
  #stick .base, #stick .knob { position: absolute; border-radius: 50%; transform: translate(-50%, -50%); }
  #stick .base {
    width: 20cqw; height: 20cqw;
    border: 2px solid rgba(143, 227, 192, .3);
    background: rgba(10, 24, 20, .32);
  }
  #stick .knob {
    width: 9.6cqw; height: 9.6cqw;
    background: rgba(143, 227, 192, .46);
    border: 2px solid rgba(223, 243, 255, .55);
  }

  .btn {
    position: absolute;
    aspect-ratio: 1;
    border-radius: 50%;
    border: 2px solid rgba(143, 227, 192, .4);
    background: rgba(18, 34, 28, .46);
    color: #cfe8dd;
    font-family: inherit; font-weight: bold; font-size: 14px;
    display: flex; align-items: center; justify-content: center;
    touch-action: none;
  }
  .btn.press { background: rgba(143, 227, 192, .45); color: #06110d; }
  #btnAtk  { right: 5%;  bottom: calc(8% + env(safe-area-inset-bottom, 0px)); width: 25%; }
  #btnDash { right: 33%; bottom: calc(4% + env(safe-area-inset-bottom, 0px)); width: 18%; }
  @container (min-width: 1px) {
    .btn { font-size: 4.2cqw; }
  }

  /* ── 데스크톱 사이드 안내 ── */
  #side {
    display: none;
    position: fixed; right: 28px; top: 50%; transform: translateY(-50%);
    width: 250px; color: #4d6b61; font-size: 13px; line-height: 1.85;
  }
  #side h1 { color: #8fe3c0; font-size: 17px; margin: 0 0 4px; letter-spacing: .5px; }
  #side .k { color: #cfe8dd; font-weight: bold; }
  #side hr { border: 0; border-top: 1px solid #1a2622; margin: 14px 0; }
  @media (min-width: 900px) { body:not(.touch) #side { display: block; } }
</style>

<script>
(() => {
"use strict";

/* ─────────────────────────── 규격 ─────────────────────────── */
const TS = 36, MW = 15, MH = 24;
const W  = MW * TS;      // 540 · 캔버스 = 아레나 가로
const AH = MH * TS;      // 864 · 아레나 세로 (월드 좌표는 여기까지)
const HUD_H = 108;       // 상단 정보바 전용 공간 — 맵과 겹치지 않는다
const H  = AH + HUD_H;   // 972 · 캔버스 세로

const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");

const COL = {
  floor: "#131a19", floor2: "#101615",
  wall: "#26332e", wallTop: "#33443c",
  hero: "#8fe3c0", heroDk: "#3d7f66",
  rift: "#b06cff", danger: "#ff5c5c",
  gem: "#c89bff", food: "#ffd166",
  text: "#cfe8dd", dim: "#5d7a70",
};

const BEST_KEY = "kimdaewon.best";
const loadBest = () => { try { return +(localStorage.getItem(BEST_KEY) || 0) || 0; } catch (_) { return 0; } };
const saveBest = v => { try { localStorage.setItem(BEST_KEY, String(v)); } catch (_) {} };
let best = loadBest();

/* ─────────────────────────── 입력 ─────────────────────────── */
const keys = Object.create(null);
let enterEdge = false, attackEdge = false;
const touch = { on: false, active: false, x: 0, y: 0, dash: false };

/* 씬 전환 직후 입력을 막는 게이트. 전환 시점의 연타가 다음 화면을 삼키는 걸 막는다. */
function requestAdvance() {
  if (state.sceneLock > 0) return false;
  enterEdge = true;
  return true;
}

addEventListener("keydown", e => {
  if (["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Space"].includes(e.code)) e.preventDefault();
  if (!keys[e.code]) {
    if (e.code === "Enter") {
      if (state.scene === "shop") shopKey();
      else if (SCENE_TAP.has(state.scene)) requestAdvance();
      else if (state.scene === "dead" || state.scene === "ending") { if (state.sceneLock <= 0) enterEdge = true; }
    }
    if (e.code === "KeyJ" || e.code === "Space") { if (state.scene === "play") attackEdge = true; }
  }
  keys[e.code] = true;
});
addEventListener("keyup", e => { keys[e.code] = false; });
addEventListener("blur", () => { for (const k in keys) keys[k] = false; touch.dash = false; });

const down = (...codes) => codes.some(c => keys[c]);

/* 탭 아무 데나 눌러 넘어가는 씬 (엔딩·사망은 전용 버튼만 받는다) */
const SCENE_TAP = new Set(["title", "story", "card"]);

/* ─────────────────────────── 유틸 ─────────────────────────── */
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
function angDiff(a, b) {
  let d = (a - b) % (Math.PI * 2);
  if (d > Math.PI) d -= Math.PI * 2;
  if (d < -Math.PI) d += Math.PI * 2;
  return d;
}

/* ─────────────────────────── 데이터 ─────────────────────────── */
const CHAPTERS = [
  { name:"폐허의 마트",     theme:"mart",  kind:"scavenge", need:6,
    flavor:"유통기한은 400년쯤 지났다. 그래도 먹는다." },
  { name:"싱그러운 들판",   theme:"field", kind:"combat", spawn:{walker:5},
    flavor:"풀냄새가 난다. 진짜 풀이다." },
  { name:"마수의 숲",       theme:"field", kind:"combat", spawn:{walker:4, spore:6},
    flavor:"나무 사이에서 무언가 미끄러지는 소리." },
  { name:"버려진 광산",     theme:"mine",  kind:"combat", spawn:{walker:3, charger:3},
    flavor:"갱도 안쪽에서 발 구르는 소리가 울린다." },
  { name:"폐성의 회랑",     theme:"stone", kind:"combat", spawn:{walker:3, spore:5, watcher:2},
    flavor:"무너진 성벽 너머에서 주문 소리가 들린다." },
  { name:"얼어붙은 호수",   theme:"ice",   kind:"combat", spawn:{spore:6, splitter:3, charger:2},
    flavor:"얼음 아래에서 무언가 갈라지고 있다." },
  { name:"마왕성 앞마당",   theme:"dark",  kind:"combat", spawn:{walker:4, charger:3, watcher:2, splitter:2},
    flavor:"문 앞을 지키는 것들이 전부 모여 있다." },
  { name:"마왕성",          theme:"dark",  kind:"boss",
    flavor:"공기가 일그러진다. 마트에서 봤던 그 느낌." },
];

const ENEMY_DEF = {
  walker:   { name:"고블린",    hp:38,  spd:58,  r:15, dmg:13, color:"#8a9b4a", score:100,  gem:3 },
  spore:    { name:"슬라임",    hp:16,  spd:118, r:10, dmg:7,  color:"#5fd2c0", score:60,   gem:1 },
  watcher:  { name:"흑마법사",  hp:52,  spd:42,  r:16, dmg:9,  color:"#5f7fd3", score:180,  gem:6, ranged:true },
  charger:  { name:"돌진병",    hp:46,  spd:60,  r:16, dmg:16, color:"#c46a4a", score:220,  gem:5, charge:true, rush:430 },
  splitter: { name:"분열체",    hp:40,  spd:72,  r:17, dmg:11, color:"#7fd15f", score:150,  gem:4, split:2 },
  boss:     { name:"마왕 현상", hp:560, spd:46,  r:34, dmg:18, color:"#b06cff", score:1500, gem:40, boss:true },
};

const CODEX = {
  walker:   "곧장 달려든다. 붙기 전에 쳐내라.",
  spore:    "빠르지만 약하다. 지그재그로 다가온다.",
  watcher:  "거리를 벌리며 3연발 탄막을 쏜다.\n탄막은 렌치로 쳐낼 수 있다.",
  charger:  "멈춰서 자세를 잡은 뒤 직선으로 돌진한다.\n조준선이 보이면 옆으로 피해라.",
  splitter: "쓰러뜨리면 둘로 갈라진다.\n갈라진 것까지 정리해야 끝난다.",
  boss:     "탄막과 소환을 반복한다.\n체력 절반 아래에서 더 사나워진다.",
};

const UPGRADES = [
  { id:"hp",   name:"최대 체력",   eff:"+20" },
  { id:"food", name:"최대 허기",   eff:"+20 · 감소 -10%" },
  { id:"atk",  name:"렌치 공격력", eff:"+4" },
  { id:"spd",  name:"공격 속도",   eff:"쿨다운 -0.04초" },
  { id:"dash", name:"회피",        eff:"쿨다운 -0.1초 · 무적 +0.03초" },
];
const UP_MAX = 4;
const UP_COST = [10, 18, 30, 46];   // 스테이지가 8개로 늘어 총 수급 약 180에 맞춘 값

const STORY = [
`단기 4361년.

유례없는 핵전쟁으로
대륙은 잿더미가 되었다.

두 발로 서 있는 생명체는
이제 단 하나.

김대원.

그는 오늘도 빈 마트를 돈다.
유통기한이 지난 통조림,
김빠진 생수.

그것으로 하루를 더 산다.`,
`선반 사이의 공기가 일그러진다.

허공에 동그란 유리창 하나.
그 너머로, 더는 볼 수 없다고
믿었던 싱그러운 들판이 비친다.

풀냄새. 바람. 살아 있는 초록.

김대원은 렌치를 고쳐 쥐고,
유리창에 손을 댄다 —`,
];

/* ─────────────────────────── 상태 ─────────────────────────── */
let state, storyIdx;

function newGame() {
  state = {
    scene: "title", sceneLock: 0,
    time: 0, runTime: 0, seqT: 0, cardT: 0,
    shake: 0, flash: 0, fade: 0,
    chapterIdx: 0, pendingChapter: 0,
    kills: 0, score: 0, gems: 0,
    up: { hp:0, food:0, atk:0, spd:0, dash:0 },
    seen: new Set(),
    player: null,
    map: null, enemies: [], items: [], bullets: [], parts: [], portal: null,
    toast: "", toastT: 0,
    saved: false,
  };
  storyIdx = 0;
  makePlayer();
}

/* 업그레이드가 반영된 능력치 */
const stat = {
  maxhp:   () => 100 + 20 * state.up.hp,
  maxfood: () => 100 + 20 * state.up.food,
  foodRate:() => 1.5 * (1 - 0.10 * state.up.food),
  dmg:     () => 16 + 4 * state.up.atk,
  atkCd:   () => 0.38 - 0.04 * state.up.spd,
  dashCd:  () => 0.85 - 0.10 * state.up.dash,
  dashInv: () => 0.22 + 0.03 * state.up.dash,
};

function makePlayer() {
  state.player = {
    x: W / 2, y: AH - 5 * TS, r: 12, face: -Math.PI / 2,
    hp: stat.maxhp(), hunger: stat.maxfood(),
    atkCd: 0, swing: 0, dashCd: 0, dashT: 0, dvx: 0, dvy: 0,
    inv: 0, hurtT: 0, supplies: 0,
  };
}

function setScene(s, lock = 0.6) {
  state.scene = s;
  state.sceneLock = lock;
  state.seqT = 0;
  // 전환 시점에 남아 있던 입력을 전부 버린다
  enterEdge = false; attackEdge = false; touch.dash = false;
  if (endStick) endStick();
}

function toast(msg) { state.toast = msg; state.toastT = 3.0; }

/* ─────────────────────────── 맵 ─────────────────────────── */
function makeMap(ch) {
  const g = [];
  for (let y = 0; y < MH; y++) {
    g[y] = [];
    for (let x = 0; x < MW; x++) g[y][x] = (x === 0 || y === 0 || x === MW - 1 || y === MH - 1) ? 1 : 0;
  }
  if (ch.kind === "scavenge") {
    const gaps = [Math.floor(MH / 3), Math.floor(MH * 2 / 3)];
    for (let bx = 2; bx <= MW - 4; bx += 4) {
      for (let y = 2; y < MH - 2; y++) {
        if (gaps.includes(y)) continue;
        g[y][bx] = 1; g[y][bx + 1] = 1;
      }
    }
  } else if (ch.kind === "boss") {
    for (const [px, py] of [[3,5],[MW-5,5],[3,MH-7],[MW-5,MH-7]]) {
      g[py][px] = 1; g[py][px+1] = 1; g[py+1][px] = 1; g[py+1][px+1] = 1;
    }
  } else {
    let placed = 0, tries = 0;
    while (placed < 18 && tries++ < 600) {
      const x = Math.floor(rnd(2, MW - 3)), y = Math.floor(rnd(2, MH - 3));
      if (g[y][x]) continue;
      if (y > MH - 7 && Math.abs(x - Math.floor(MW / 2)) < 3) continue;  // 시작 지점 확보
      g[y][x] = 1; placed++;
    }
  }
  return g;
}

const solid = (g, tx, ty) => (tx < 0 || ty < 0 || tx >= MW || ty >= MH) ? true : g[ty][tx] === 1;

function nearestFree(g, tx, ty) {
  for (let r = 0; r < Math.max(MW, MH); r++) {
    for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) {
      const x = tx + dx, y = ty + dy;
      if (x < 1 || y < 1 || x >= MW - 1 || y >= MH - 1) continue;
      if (!g[y][x]) return { x: x * TS + TS / 2, y: y * TS + TS / 2 };
    }
  }
  return { x: W / 2, y: AH / 2 };
}

function freeSpots(g, away, minD) {
  const out = [];
  for (let y = 1; y < MH - 1; y++) for (let x = 1; x < MW - 1; x++) {
    if (g[y][x]) continue;
    const p = { x: x * TS + TS / 2, y: y * TS + TS / 2 };
    if (away && dist(p, away) < minD) continue;
    out.push(p);
  }
  return out;
}

/* ─────────────────────────── 챕터 진행 ─────────────────────────── */
function beginChapter() {
  const i = state.pendingChapter;
  const ch = CHAPTERS[i];
  state.chapterIdx = i;
  state.map = makeMap(ch);
  state.enemies = []; state.items = []; state.bullets = []; state.parts = [];
  state.portal = null;
  state.fade = 1;

  const p = state.player;
  const s = nearestFree(state.map, Math.floor(MW / 2), MH - 4);
  p.x = s.x; p.y = s.y;
  p.hp = Math.min(p.hp, stat.maxhp());
  p.dashT = 0; p.swing = 0; p.inv = 0.7;

  const spots = freeSpots(state.map, p, 230);
  const take = () => spots.length ? spots.splice(Math.floor(Math.random() * spots.length), 1)[0]
                                  : nearestFree(state.map, Math.floor(MW / 2), 3);

  if (ch.kind === "scavenge") {
    p.supplies = 0;
    const kinds = ["통조림","생수","라면","건빵","통조림","생수"];
    for (let k = 0; k < ch.need; k++) {
      const t = take();
      state.items.push({ x:t.x, y:t.y, r:11, type:"supply", label:kinds[k % kinds.length], t:rnd(0,6) });
    }
  } else if (ch.kind === "boss") {
    const t = nearestFree(state.map, Math.floor(MW / 2), 5);
    state.enemies.push(makeEnemy("boss", t.x, t.y));
  } else {
    for (const [type, n] of Object.entries(ch.spawn)) {
      for (let k = 0; k < n; k++) { const t = take(); state.enemies.push(makeEnemy(type, t.x, t.y)); }
    }
  }
  setScene("play", 0.2);
}

/* 스테이지 카드에 띄울 신규 적 목록 */
function newEnemiesFor(i) {
  const ch = CHAPTERS[i];
  const types = ch.kind === "boss" ? ["boss"] : Object.keys(ch.spawn || {});
  return types.filter(t => !state.seen.has(t));
}
function markSeen(i) { for (const t of newEnemiesFor(i)) state.seen.add(t); }

function gotoShop(next) {
  state.pendingChapter = next;
  shopSel = 0;
  setScene("shop", 0.8);
}
function gotoCard() {
  state.cardT = 0;
  setScene("card", 0.7);
}

function makeEnemy(type, x, y) {
  const d = ENEMY_DEF[type];
  return { type, x, y, r:d.r, hp:d.hp, maxhp:d.hp, spd:d.spd, hit:0, cd:rnd(1,2.5), touch:0, phase:0,
           wob:rnd(0,6), mode:0, windT:0, rushT:0, aim:0 };
}

/* ─────────────────────────── 충돌 ─────────────────────────── */
function moveEnt(e, dx, dy, g) {
  e.x += dx; resolveAxis(e, g, true);
  e.y += dy; resolveAxis(e, g, false);
}
function resolveAxis(e, g, horizontal) {
  const r = e.r;
  const minX = Math.floor((e.x - r) / TS), maxX = Math.floor((e.x + r) / TS);
  const minY = Math.floor((e.y - r) / TS), maxY = Math.floor((e.y + r) / TS);
  for (let ty = minY; ty <= maxY; ty++) for (let tx = minX; tx <= maxX; tx++) {
    if (!solid(g, tx, ty)) continue;
    const L = tx * TS, T = ty * TS, R = L + TS, B = T + TS;
    if (e.x + r <= L || e.x - r >= R || e.y + r <= T || e.y - r >= B) continue;
    if (horizontal) e.x = (e.x < L + TS / 2) ? L - r : R + r;
    else            e.y = (e.y < T + TS / 2) ? T - r : B + r;
  }
}

/* ─────────────────────────── 이펙트 ─────────────────────────── */
function burst(x, y, n, color, spd = 160, life = .45) {
  for (let i = 0; i < n; i++) {
    const a = rnd(0, Math.PI * 2), s = rnd(spd * .3, spd);
    state.parts.push({ x, y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life, max:life, color, sz:rnd(1.5,3.5) });
  }
}
function popText(x, y, text, color, size = 13, life = .8) {
  state.parts.push({ x:x + rnd(-8,8), y, vx:rnd(-12,12), vy:-40, life, max:life, color, text, size });
}

/* ─────────────────────────── 업데이트 ─────────────────────────── */
function update(dt) {
  state.time += dt;
  state.sceneLock = Math.max(0, state.sceneLock - dt);
  state.shake = Math.max(0, state.shake - dt * 40);
  state.flash = Math.max(0, state.flash - dt * 3);
  state.fade = Math.max(0, state.fade - dt * 1.6);
  if (state.toastT > 0) state.toastT -= dt;

  if (state.scene === "card") {
    state.cardT += dt;
    if (state.cardT > 3.6) { markSeen(state.pendingChapter); beginChapter(); }
    return;
  }
  if (state.scene === "bossdown") {
    state.seqT += dt;
    stepParticles(dt);
    if (state.seqT > 1.4) { finishRun("ending"); }
    return;
  }
  if (state.scene !== "play") { stepParticles(dt); return; }

  const p = state.player, g = state.map, ch = CHAPTERS[state.chapterIdx];

  /* 이동 */
  let ix = (down("KeyD","ArrowRight") ? 1 : 0) - (down("KeyA","ArrowLeft") ? 1 : 0);
  let iy = (down("KeyS","ArrowDown") ? 1 : 0) - (down("KeyW","ArrowUp") ? 1 : 0);
  if (touch.active && (touch.x || touch.y)) { ix = touch.x; iy = touch.y; }
  let len = Math.hypot(ix, iy);
  if (len > 0) p.face = Math.atan2(iy, ix);
  if (len > 1) { ix /= len; iy /= len; len = 1; }

  p.atkCd  = Math.max(0, p.atkCd - dt);
  p.dashCd = Math.max(0, p.dashCd - dt);
  p.swing  = Math.max(0, p.swing - dt);
  p.inv    = Math.max(0, p.inv - dt);
  p.hurtT  = Math.max(0, p.hurtT - dt);
  state.runTime += dt;

  if ((down("KeyK","ShiftLeft","ShiftRight") || touch.dash) && p.dashCd <= 0 && p.dashT <= 0 && len > .15) {
    p.dashT = .18; p.dashCd = stat.dashCd(); p.inv = Math.max(p.inv, stat.dashInv());
    const dn = Math.hypot(ix, iy) || 1;
    p.dvx = ix / dn * 520; p.dvy = iy / dn * 520;
    burst(p.x, p.y, 8, COL.heroDk, 90, .3);
  }

  if (p.dashT > 0) { p.dashT -= dt; moveEnt(p, p.dvx * dt, p.dvy * dt, g); }
  else moveEnt(p, ix * 178 * dt, iy * 178 * dt, g);

  /* 공격 — 사거리 안에 적이 있으면 그쪽으로 자동 조준 */
  const REACH = 50;
  if (attackEdge && p.atkCd <= 0) {
    p.atkCd = stat.atkCd(); p.swing = .18;
    let aim = p.face, bestD = 1e9;
    for (const e of state.enemies) {
      const d = dist(p, e);
      if (d < (REACH + e.r) * 1.4 && d < bestD) { bestD = d; aim = Math.atan2(e.y - p.y, e.x - p.x); }
    }
    p.face = aim;
    const dmg = stat.dmg();
    for (const e of state.enemies) {
      const d = dist(p, e);
      if (d < REACH + e.r && Math.abs(angDiff(Math.atan2(e.y - p.y, e.x - p.x), aim)) < 1.0) damageEnemy(e, dmg, aim);
    }
    for (let i = state.bullets.length - 1; i >= 0; i--) {
      const b = state.bullets[i];
      if (dist(p, b) < REACH + 4 && Math.abs(angDiff(Math.atan2(b.y - p.y, b.x - p.x), aim)) < 1.0) {
        burst(b.x, b.y, 5, "#fff", 120, .25);
        popText(b.x, b.y, "쳐냄", "#dff3ff", 11, .6);
        state.bullets.splice(i, 1);
      }
    }
  }
  attackEdge = false;

  /* 허기 */
  p.hunger -= dt * stat.foodRate();
  if (p.hunger <= 0) { p.hunger = 0; hurtPlayer(dt * 5, true); }

  /* 아이템 */
  for (let i = state.items.length - 1; i >= 0; i--) {
    const it = state.items[i];
    it.t += dt;
    if (it.type === "gem") {                       // 자석 효과
      const d = dist(p, it);
      if (d < 130) {
        const a = Math.atan2(p.y - it.y, p.x - it.x);
        const s = 90 + (130 - d) * 3.2;
        it.x += Math.cos(a) * s * dt; it.y += Math.sin(a) * s * dt;
      }
    }
    if (dist(p, it) < p.r + it.r) {
      state.items.splice(i, 1);
      if (it.type === "supply") {
        p.supplies++;
        p.hunger = clamp(p.hunger + 26, 0, stat.maxfood());
        state.score += 50; state.gems += 2;
        popText(it.x, it.y, it.label, COL.food, 13);
        toast(`보급품 ${p.supplies} / ${ch.need}`);
      } else if (it.type === "food") {
        p.hunger = clamp(p.hunger + 34, 0, stat.maxfood());
        popText(it.x, it.y, "+허기", COL.food, 13);
      } else if (it.type === "medkit") {
        p.hp = clamp(p.hp + 28, 0, stat.maxhp());
        popText(it.x, it.y, "+체력", "#6fe08a", 13);
      } else if (it.type === "gem") {
        state.gems += it.val;
        popText(it.x, it.y, "+" + it.val, COL.gem, 13);
      }
      if (it.type !== "gem") burst(it.x, it.y, 8, COL.food, 110, .35);
    }
  }

  /* 적 */
  for (let i = state.enemies.length - 1; i >= 0; i--) {
    const e = state.enemies[i], d = ENEMY_DEF[e.type];
    e.hit = Math.max(0, e.hit - dt);
    e.touch = Math.max(0, e.touch - dt);
    e.wob += dt;

    const toP = Math.atan2(p.y - e.y, p.x - e.x), dp = dist(p, e);

    if (d.boss) {
      e.cd -= dt;
      const hpR = e.hp / e.maxhp;
      const keep = hpR < .5 ? 160 : 205;
      moveEnt(e, Math.cos(toP) * e.spd * (dp > keep ? 1 : -0.5) * dt,
                 Math.sin(toP) * e.spd * (dp > keep ? 1 : -0.5) * dt, g);
      if (e.cd <= 0) {
        e.phase = (e.phase + 1) % 3;
        if (e.phase === 2) {
          for (let k = 0; k < (hpR < .5 ? 3 : 2); k++) {
            const a = rnd(0, Math.PI * 2);
            state.enemies.push(makeEnemy("spore", e.x + Math.cos(a) * 46, e.y + Math.sin(a) * 46));
          }
          burst(e.x, e.y, 20, COL.rift, 200, .5);
          e.cd = 3.4;
        } else {
          const n = hpR < .5 ? 13 : 10, off = rnd(0, Math.PI * 2);
          for (let k = 0; k < n; k++) {
            const a = off + (k / n) * Math.PI * 2;
            state.bullets.push({ x:e.x, y:e.y, vx:Math.cos(a)*150, vy:Math.sin(a)*150, r:6, dmg:11, life:5 });
          }
          state.shake = 8;
          e.cd = hpR < .5 ? 1.7 : 2.3;
        }
      }
    } else if (d.ranged) {
      e.cd -= dt;
      const keep = 150;
      const mv = dp > keep + 30 ? 1 : dp < keep - 40 ? -1 : 0;
      moveEnt(e, Math.cos(toP) * e.spd * mv * dt, Math.sin(toP) * e.spd * mv * dt, g);
      if (e.cd <= 0 && dp < 380) {
        e.cd = 2.6;
        for (let k = -1; k <= 1; k++) {
          const a = toP + k * .15;
          state.bullets.push({ x:e.x, y:e.y, vx:Math.cos(a)*170, vy:Math.sin(a)*170, r:5, dmg:d.dmg, life:4 });
        }
      }
    } else if (d.charge) {
      // 0: 접근 → 1: 조준선 노출(예고) → 2: 직선 돌진
      e.cd = Math.max(0, e.cd - dt);
      if (e.mode === 2) {
        e.rushT -= dt;
        const bx = e.x, by = e.y;
        moveEnt(e, Math.cos(e.aim) * d.rush * dt, Math.sin(e.aim) * d.rush * dt, g);
        const hitWall = Math.hypot(e.x - bx, e.y - by) < d.rush * dt * 0.5;
        if (e.rushT <= 0 || hitWall) {
          e.mode = 0; e.cd = 1.3;
          if (hitWall) { burst(e.x, e.y, 10, d.color, 160, .4); state.shake = Math.max(state.shake, 6); }
        }
      } else if (e.mode === 1) {
        e.windT -= dt;                       // 예고 중에는 조준을 갱신하지 않는다 — 옆으로 피할 수 있게
        if (e.windT <= 0) { e.mode = 2; e.rushT = .45; }
      } else {
        moveEnt(e, Math.cos(toP) * e.spd * dt, Math.sin(toP) * e.spd * dt, g);
        if (dp < 250 && e.cd <= 0) { e.mode = 1; e.windT = .7; e.aim = toP; }
      }
    } else {
      const a = toP + (e.type === "spore" ? Math.sin(e.wob * 6) * .5 : 0);
      moveEnt(e, Math.cos(a) * e.spd * dt, Math.sin(a) * e.spd * dt, g);
    }

    if (dp < p.r + e.r && e.touch <= 0) {
      e.touch = .7;
      hurtPlayer(d.dmg);
      const kb = Math.atan2(p.y - e.y, p.x - e.x);
      moveEnt(p, Math.cos(kb) * 18, Math.sin(kb) * 18, g);
    }

    if (e.hp <= 0) {
      state.enemies.splice(i, 1);
      state.kills++; state.score += d.score;
      burst(e.x, e.y, d.boss ? 60 : 16, d.color, d.boss ? 320 : 190, d.boss ? 1.1 : .5);
      state.shake = d.boss ? 24 : 5;
      state.items.push({ x:e.x, y:e.y, r:9, type:"gem", val:d.gem, t:0 });
      if (d.split) {                       // 분열체 — 죽으면 둘로 갈라진다
        for (let k = 0; k < d.split; k++) {
          const a = rnd(0, Math.PI * 2);
          state.enemies.push(makeEnemy("spore", e.x + Math.cos(a) * 26, e.y + Math.sin(a) * 26));
        }
        popText(e.x, e.y - 24, "분열!", "#9ef07a", 14, .8);
      }
      if (!d.boss) {
        const roll = Math.random();
        if (roll < .20)      state.items.push({ x:e.x + 14, y:e.y, r:10, type:"food", t:0 });
        else if (roll < .32) state.items.push({ x:e.x + 14, y:e.y, r:10, type:"medkit", t:0 });
      } else {
        state.flash = 1;
        setScene("bossdown", 99);          // 연출 동안 입력 차단
        return;
      }
    }
  }

  /* 탄환 */
  for (let i = state.bullets.length - 1; i >= 0; i--) {
    const b = state.bullets[i];
    b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
    if (b.life <= 0 || solid(g, Math.floor(b.x / TS), Math.floor(b.y / TS))) {
      burst(b.x, b.y, 5, "#c9a3ff", 80, .25);
      state.bullets.splice(i, 1); continue;
    }
    if (dist(p, b) < p.r + b.r) {
      if (p.inv > 0) { popText(p.x, p.y - 22, "회피!", "#8fe3c0", 14, .7); }
      else hurtPlayer(b.dmg);
      burst(b.x, b.y, 7, p.inv > 0 ? "#8fe3c0" : COL.danger, 120, .3);
      state.bullets.splice(i, 1);
    }
  }

  stepParticles(dt);

  /* 클리어 */
  if (!state.portal) {
    const done = ch.kind === "scavenge" ? p.supplies >= ch.need : state.enemies.length === 0;
    if (done) {
      const spots = freeSpots(g, p, 150);
      const s = spots.length ? spots[Math.floor(Math.random() * spots.length)] : nearestFree(g, Math.floor(MW/2), 3);
      state.portal = { x:s.x, y:s.y, r:22, t:0 };
      state.flash = .8; state.shake = 14;
      toast(state.chapterIdx === 0 ? "허공에 동그란 유리창이 떠올랐다" : "다음 게이트가 열렸다");
    }
  } else {
    state.portal.t += dt;
    if (dist(p, state.portal) < p.r + state.portal.r) {
      if (state.chapterIdx === 0) { storyIdx = 1; setScene("story", 0.7); }
      else gotoShop(state.chapterIdx + 1);
    }
  }

  if (p.hp <= 0) { p.hp = 0; state.shake = 20; finishRun("dead"); }
}

function stepParticles(dt) {
  for (let i = state.parts.length - 1; i >= 0; i--) {
    const q = state.parts[i];
    q.x += q.vx * dt; q.y += q.vy * dt;
    q.vx *= .93; q.vy *= .93;
    q.life -= dt;
    if (q.life <= 0) state.parts.splice(i, 1);
  }
}

function finishRun(scene) {
  if (scene === "ending") state.score += Math.max(0, 3000 - Math.floor(state.runTime * 10));
  if (!state.saved) {
    state.saved = true;
    if (state.score > best) { best = state.score; saveBest(best); }
  }
  setScene(scene, 1.2);
}

function damageEnemy(e, dmg, dir) {
  e.hp -= dmg;
  e.hit = .12;
  burst(e.x, e.y, 6, "#ffe8b0", 150, .3);
  popText(e.x, e.y - e.r - 4, String(dmg), "#ffffff", 14, .7);
  moveEnt(e, Math.cos(dir) * 12, Math.sin(dir) * 12, state.map);
  state.shake = Math.max(state.shake, 3);
}

function hurtPlayer(dmg, silent) {
  const p = state.player;
  if (!silent && p.inv > 0) return;
  p.hp -= dmg;
  if (!silent) {
    p.inv = .55; p.hurtT = .25;
    state.shake = 10; state.flash = .5;
    popText(p.x, p.y - 26, "-" + Math.round(dmg), COL.danger, 18, .9);
    burst(p.x, p.y, 10, COL.danger, 150, .4);
  }
}

/* ─────────────────────────── 상점 ─────────────────────────── */
let shopSel = 0;
const SHOP_ROW_Y = 250, SHOP_ROW_H = 96;

function upCost(id) { return UP_COST[state.up[id]]; }
function canBuy(id) { return state.up[id] < UP_MAX && state.gems >= upCost(id); }
function buyUpgrade(id) {
  if (!canBuy(id)) return false;
  state.gems -= upCost(id);
  state.up[id]++;
  const p = state.player;
  if (id === "hp")   p.hp     = clamp(p.hp + 20, 0, stat.maxhp());
  if (id === "food") p.hunger = clamp(p.hunger + 20, 0, stat.maxfood());
  return true;
}
function shopKey() {   // 키보드용 (Enter = 출발)
  if (state.sceneLock > 0) return;
  gotoCard();
}
function shopButtons() {
  const out = [];
  UPGRADES.forEach((u, i) => {
    out.push({ id:u.id, kind:"buy", x:W - 128, y:SHOP_ROW_Y + i * SHOP_ROW_H - 26, w:112, h:52 });
  });
  out.push({ id:"go", kind:"go", x:W/2 - 110, y:H - 130, w:220, h:60 });
  return out;
}

function sceneButtons() {
  if (state.scene === "shop") return shopButtons();
  // 엔딩은 본문이 아래까지 내려오므로 버튼을 더 낮게 둔다 (텍스트와 겹치지 않도록)
  if (state.scene === "ending")
    return [{ id:"restart", kind:"restart", x:W/2 - 110, y:H - 118, w:220, h:60 }];
  if (state.scene === "dead")
    return [{ id:"restart", kind:"restart", x:W/2 - 110, y:H/2 + 96, w:220, h:60 }];
  return [];
}

function hitButton(gx, gy) {
  for (const b of sceneButtons()) {
    if (gx >= b.x && gx <= b.x + b.w && gy >= b.y && gy <= b.y + b.h) return b;
  }
  return null;
}

function pressButton(b) {
  if (b.kind === "buy") {
    if (buyUpgrade(b.id)) { state.flash = .25; }
  } else if (b.kind === "go") {
    gotoCard();
  } else if (b.kind === "restart") {
    newGame();
  }
}

/* ─────────────────────────── 씬 진행 ─────────────────────────── */
function handleEnter() {
  if (!enterEdge) return;
  enterEdge = false;
  const sc = state.scene;
  if (sc === "title") {
    newGame(); setScene("story", 0.4); storyIdx = 0;
  } else if (sc === "story") {
    if (storyIdx === 0) { state.pendingChapter = 0; markSeen(0); beginChapter(); }
    else { gotoShop(1); }
  } else if (sc === "card") {
    markSeen(state.pendingChapter); beginChapter();
  } else if (sc === "dead" || sc === "ending") {
    newGame();
  }
}

/* ─────────────────────────── 터치 / 포인터 ─────────────────────────── */
let endStick = null;

function setupInput() {
  const wrap  = document.getElementById("wrap");
  const stick = document.getElementById("stick");
  const base  = stick.querySelector(".base");
  const knob  = stick.querySelector(".knob");
  let stickId = null, ox = 0, oy = 0, radius = 54;

  const enableTouchUI = () => {
    if (touch.on) return;
    touch.on = true;
    document.body.classList.add("touch");
  };
  if (matchMedia("(pointer: coarse) and (hover: none)").matches) enableTouchUI();

  const place = (dx, dy) => {
    base.style.left = ox + "px"; base.style.top = oy + "px";
    knob.style.left = (ox + dx) + "px"; knob.style.top = (oy + dy) + "px";
  };
  endStick = () => {
    stickId = null;
    touch.active = false; touch.x = 0; touch.y = 0;
    stick.classList.remove("on");
  };

  const toGame = (cx, cy) => {
    const r = cv.getBoundingClientRect();
    return { x: (cx - r.left) / r.width * W, y: (cy - r.top) / r.height * H };
  };

  wrap.addEventListener("pointerdown", e => {
    if (e.pointerType !== "mouse") enableTouchUI();
    e.preventDefault();

    if (state.scene !== "play") {
      if (state.sceneLock > 0) return;                 // 전환 직후 입력은 통째로 버린다
      const g = toGame(e.clientX, e.clientY);
      const b = hitButton(g.x, g.y);
      if (b) { pressButton(b); return; }
      if (SCENE_TAP.has(state.scene)) requestAdvance();
      return;
    }

    if (e.pointerType === "mouse" || stickId !== null) return;
    const r = wrap.getBoundingClientRect();
    if (e.clientX - r.left > r.width * 0.5) return;    // 오른쪽 절반은 버튼 영역
    stickId = e.pointerId;
    try { wrap.setPointerCapture(e.pointerId); } catch (_) {}
    radius = r.width * 0.10;
    ox = e.clientX - r.left; oy = e.clientY - r.top;
    touch.active = true; touch.x = 0; touch.y = 0;
    stick.classList.add("on");
    place(0, 0);
  });

  wrap.addEventListener("pointermove", e => {
    if (e.pointerId !== stickId) return;
    e.preventDefault();
    const r = wrap.getBoundingClientRect();
    let dx = (e.clientX - r.left) - ox, dy = (e.clientY - r.top) - oy;
    const d = Math.hypot(dx, dy);
    if (d > radius) { dx = dx / d * radius; dy = dy / d * radius; }
    place(dx, dy);
    touch.x = dx / radius; touch.y = dy / radius;
  });

  for (const ev of ["pointerup", "pointercancel"])
    wrap.addEventListener(ev, e => { if (e.pointerId === stickId) endStick(); });

  /* 공격·회피 버튼은 절대 씬을 진행시키지 않는다 */
  const bindBtn = (el, onDown, onUp) => {
    el.addEventListener("pointerdown", e => {
      e.preventDefault(); e.stopPropagation();
      enableTouchUI();
      if (state.scene !== "play") return;
      el.classList.add("press");
      onDown();
    });
    const up = e => { e.preventDefault(); e.stopPropagation(); el.classList.remove("press"); if (onUp) onUp(); };
    for (const ev of ["pointerup", "pointercancel", "pointerleave"]) el.addEventListener(ev, up);
  };
  bindBtn(document.getElementById("btnAtk"),  () => { attackEdge = true; });
  bindBtn(document.getElementById("btnDash"), () => { touch.dash = true; }, () => { touch.dash = false; });
}

/* 표시 크기는 CSS 비율 계산에 맡기지 않고 직접 픽셀로 지정한다.
   documentElement.clientHeight 는 html 이 position:fixed 라 실제 보이는 높이를 준다
   (100vh 와 달리 주소창 유무에 속지 않는다). */
function fitCanvas() {
  const de = document.documentElement;
  const vw = de.clientWidth  || W;
  const vh = de.clientHeight || H;
  const s  = Math.min(vw / W, vh / H);
  const wrap = document.getElementById("wrap");
  wrap.style.width  = Math.floor(W * s) + "px";
  wrap.style.height = Math.floor(H * s) + "px";

  const dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width  = Math.round(W * dpr);
  cv.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.imageSmoothingEnabled = false;
}

/* ─────────────────────────── 렌더 ─────────────────────────── */
const THEMES = {
  mart:  { f1:COL.floor, f2:COL.floor2, w:COL.wall, wt:COL.wallTop, deco:null },
  field: { f1:"#1c3520", f2:"#172d1c", w:"#6b5a3a", wt:"#8f7748", deco:"grass" },
  stone: { f1:"#2b2a26", f2:"#242320", w:"#4a4740", wt:"#5f5b51", deco:"crack" },
  mine:  { f1:"#241d18", f2:"#1d1713", w:"#4a3a2a", wt:"#66513a", deco:"crack" },
  ice:   { f1:"#1b2c38", f2:"#16242e", w:"#3f5a6b", wt:"#5b8098", deco:"ice" },
  dark:  { f1:"#120f1a", f2:"#0e0c15", w:"#241d33", wt:"#33294a", deco:null },
};

const blink = () => Math.floor(state.time * 2) % 2 === 0;
const ready = () => state.sceneLock <= 0;

function draw() {
  ctx.save();
  ctx.fillStyle = "#0b0f10"; ctx.fillRect(0, 0, W, H);

  const sc = state.scene;
  if (sc === "title")      { drawTitle();  ctx.restore(); return; }
  if (sc === "story")      { drawStory();  ctx.restore(); return; }
  if (sc === "card")       { drawCard();   ctx.restore(); return; }
  if (sc === "shop")       { drawShop();   ctx.restore(); return; }
  if (sc === "ending")     { drawEnding(); ctx.restore(); drawButtons(); return; }

  // 아레나는 HUD 아래 전용 공간에 그린다. 월드 좌표 (0,0)~(W,AH) 가 여기로 옮겨진다.
  ctx.translate(0, HUD_H);
  if (state.shake > 0) ctx.translate(rnd(-state.shake, state.shake) * .4, rnd(-state.shake, state.shake) * .4);
  drawMap();
  drawItems();
  if (state.portal) drawPortal();
  drawEnemies();
  drawBullets();
  if (state.scene !== "bossdown") drawPlayer();
  drawParts();
  ctx.restore();

  drawHUD();
  drawOverlays();
  if (sc === "dead") drawButtons();
}

function drawMap() {
  const g = state.map, th = THEMES[CHAPTERS[state.chapterIdx].theme] || THEMES.mart;
  for (let y = 0; y < MH; y++) for (let x = 0; x < MW; x++) {
    const px = x * TS, py = y * TS;
    if (g[y][x]) {
      ctx.fillStyle = th.w;  ctx.fillRect(px, py, TS, TS);
      ctx.fillStyle = th.wt; ctx.fillRect(px, py, TS, 6);
      ctx.fillStyle = "rgba(0,0,0,.25)"; ctx.fillRect(px, py + TS - 4, TS, 4);
    } else {
      ctx.fillStyle = ((x + y) & 1) ? th.f1 : th.f2;
      ctx.fillRect(px, py, TS, TS);
      if (th.deco === "grass" && ((x * 7 + y * 13) % 5 === 0)) {
        ctx.fillStyle = "rgba(150,220,120,.15)";
        const gx = px + ((x * 11 + y * 5) % 22) + 6, gy = py + ((x * 17 + y * 3) % 22) + 7;
        ctx.fillRect(gx, gy, 2, 6); ctx.fillRect(gx + 4, gy + 2, 2, 4);
      } else if (th.deco === "crack" && ((x * 5 + y * 9) % 7 === 0)) {
        ctx.fillStyle = "rgba(0,0,0,.22)";
        ctx.fillRect(px + ((x * 13) % 20) + 4, py + ((y * 7) % 20) + 6, 11, 2);
      } else if (th.deco === "ice" && ((x * 3 + y * 11) % 6 === 0)) {
        ctx.fillStyle = "rgba(200,235,255,.10)";
        const ix2 = px + ((x * 7 + y * 5) % 22) + 7, iy2 = py + ((x * 5 + y * 13) % 22) + 7;
        ctx.fillRect(ix2 - 5, iy2, 10, 1); ctx.fillRect(ix2, iy2 - 5, 1, 10);
      }
    }
  }
}

function drawItems() {
  for (const it of state.items) {
    const bob = Math.sin(it.t * 3) * 3;
    ctx.save(); ctx.translate(it.x, it.y + bob);
    if (it.type === "gem") {
      ctx.rotate(it.t * 2);
      ctx.fillStyle = COL.gem;
      ctx.beginPath();
      ctx.moveTo(0, -8); ctx.lineTo(6, 0); ctx.lineTo(0, 8); ctx.lineTo(-6, 0);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,.5)";
      ctx.beginPath(); ctx.moveTo(0, -8); ctx.lineTo(3, -1); ctx.lineTo(0, 2); ctx.closePath(); ctx.fill();
    } else if (it.type === "medkit") {
      ctx.fillStyle = "#f2f6f3"; ctx.fillRect(-8, -7, 16, 14);
      ctx.fillStyle = "#e05555"; ctx.fillRect(-2, -5, 4, 10); ctx.fillRect(-6, -2, 12, 4);
    } else {
      ctx.fillStyle = it.type === "supply" ? COL.food : "#c9a86a";
      ctx.fillRect(-7, -8, 14, 16);
      ctx.fillStyle = "rgba(255,255,255,.35)"; ctx.fillRect(-7, -8, 14, 3);
      ctx.fillStyle = "rgba(0,0,0,.3)";        ctx.fillRect(-7, -1, 14, 2);
    }
    ctx.restore();
    ctx.fillStyle = it.type === "gem" ? "rgba(200,155,255,.13)" : "rgba(255,209,102,.10)";
    ctx.beginPath(); ctx.arc(it.x, it.y + bob, 15 + Math.sin(it.t * 3) * 2, 0, 7); ctx.fill();
  }
}

function drawPortal() {
  const P = state.portal, t = P.t, glass = state.chapterIdx === 0;
  ctx.save(); ctx.translate(P.x, P.y);
  for (let i = 3; i >= 0; i--) {
    ctx.globalAlpha = .13 + i * .04;
    ctx.fillStyle = glass ? "#8ce07a" : COL.rift;
    ctx.beginPath(); ctx.arc(0, 0, P.r + i * 9 + Math.sin(t * 3 + i) * 3, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
  if (glass) {
    ctx.save();
    ctx.beginPath(); ctx.arc(0, 0, P.r, 0, 7); ctx.clip();
    const sky = ctx.createLinearGradient(0, -P.r, 0, P.r);
    sky.addColorStop(0, "#8fd4ff"); sky.addColorStop(.55, "#cdeeff");
    ctx.fillStyle = sky; ctx.fillRect(-P.r, -P.r, P.r * 2, P.r * 2);
    ctx.fillStyle = "#fff6c9";
    ctx.beginPath(); ctx.arc(-P.r * .45, -P.r * .5, 5, 0, 7); ctx.fill();
    ctx.fillStyle = "#4ea84c";
    ctx.beginPath(); ctx.moveTo(-P.r, P.r * .1);
    for (let x = -P.r; x <= P.r; x += 4) ctx.lineTo(x, P.r * .1 + Math.sin(x * .12 + t) * 3);
    ctx.lineTo(P.r, P.r); ctx.lineTo(-P.r, P.r); ctx.closePath(); ctx.fill();
    ctx.restore();
    ctx.strokeStyle = "#dff3ff"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(0, 0, P.r, 0, 7); ctx.stroke();
    ctx.globalAlpha = .5; ctx.strokeStyle = "#fff"; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(0, 0, P.r - 4, -2.5, -1.5); ctx.stroke();
    ctx.globalAlpha = 1;
  } else {
    ctx.rotate(t * 1.6);
    ctx.strokeStyle = "#e0c2ff"; ctx.lineWidth = 3;
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
      const a = (i / 6) * Math.PI * 2, r = P.r * (i % 2 ? .55 : 1);
      const x = Math.cos(a) * r, y = Math.sin(a) * r;
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    ctx.closePath(); ctx.stroke();
  }
  ctx.restore();
  ctx.fillStyle = COL.text; ctx.font = "12px sans-serif"; ctx.textAlign = "center";
  ctx.fillText(glass ? "손을 대기" : "게이트로 들어가기", P.x, P.y + P.r + 26);
}

function drawEnemies() {
  for (const e of state.enemies) {
    const d = ENEMY_DEF[e.type];

    // 돌진 예고선 — 이걸 보고 옆으로 피하는 게 공략법이다
    if (d.charge && e.mode === 1) {
      const prog = 1 - e.windT / .7;
      ctx.save();
      ctx.globalAlpha = .25 + prog * .5;
      ctx.strokeStyle = "#ff7a4a"; ctx.lineWidth = 2 + prog * 3;
      ctx.setLineDash([9, 7]);
      ctx.beginPath(); ctx.moveTo(e.x, e.y);
      ctx.lineTo(e.x + Math.cos(e.aim) * 300, e.y + Math.sin(e.aim) * 300);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.restore();
    }
    if (d.charge && e.mode === 2) {
      ctx.globalAlpha = .3; ctx.fillStyle = d.color;
      ctx.beginPath(); ctx.arc(e.x - Math.cos(e.aim) * 16, e.y - Math.sin(e.aim) * 16, e.r, 0, 7); ctx.fill();
      ctx.globalAlpha = 1;
    }

    ctx.save(); ctx.translate(e.x, e.y);
    if (d.charge && e.mode === 1) {
      const f = 1 - e.windT / .7;
      ctx.globalAlpha = .35 + Math.sin(f * 30) * .2;
      ctx.fillStyle = "#ff7a4a";
      ctx.beginPath(); ctx.arc(0, 0, e.r + 7, 0, 7); ctx.fill();
      ctx.globalAlpha = 1;
    }
    if (d.boss) {
      ctx.globalAlpha = .18; ctx.fillStyle = COL.rift;
      ctx.beginPath(); ctx.arc(0, 0, e.r + 22 + Math.sin(e.wob * 2) * 6, 0, 7); ctx.fill();
      ctx.globalAlpha = 1;
    }
    ctx.fillStyle = e.hit > 0 ? "#ffffff" : d.color;
    ctx.beginPath(); ctx.arc(0, Math.sin(e.wob * 7) * .8, e.r, 0, 7); ctx.fill();
    ctx.fillStyle = e.hit > 0 ? "#333" : "#ff4d4d";
    const ey = e.r * .18;
    ctx.fillRect(-e.r * .45, ey - 2, e.r * .3, 3);
    ctx.fillRect(e.r * .15, ey - 2, e.r * .3, 3);
    ctx.fillStyle = "rgba(0,0,0,.35)"; ctx.fillRect(-e.r * .6, e.r - 2, e.r * 1.2, 3);
    ctx.restore();
    if (e.hp < e.maxhp) {
      const w = d.boss ? 130 : e.r * 2.2;
      ctx.fillStyle = "rgba(0,0,0,.6)"; ctx.fillRect(e.x - w / 2, e.y - e.r - 12, w, 4);
      ctx.fillStyle = d.boss ? COL.rift : "#e06060";
      ctx.fillRect(e.x - w / 2, e.y - e.r - 12, w * clamp(e.hp / e.maxhp, 0, 1), 4);
    }
  }
}

function drawBullets() {
  for (const b of state.bullets) {
    ctx.fillStyle = "#e3c8ff";
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 7); ctx.fill();
    ctx.globalAlpha = .3; ctx.fillStyle = COL.rift;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r + 4, 0, 7); ctx.fill();
    ctx.globalAlpha = 1;
  }
}

function drawPlayer() {
  const p = state.player;
  ctx.save(); ctx.translate(p.x, p.y);
  ctx.fillStyle = "rgba(0,0,0,.35)";
  ctx.beginPath(); ctx.ellipse(0, p.r - 1, p.r * .9, p.r * .35, 0, 0, 7); ctx.fill();
  if (p.inv > 0 && Math.floor(p.inv * 20) % 2 === 0) ctx.globalAlpha = .45;
  ctx.fillStyle = p.hurtT > 0 ? "#ffffff" : "#2f4b41";
  ctx.fillRect(-9, -6, 18, 16);
  ctx.fillStyle = p.hurtT > 0 ? "#ffffff" : COL.hero;
  ctx.beginPath(); ctx.arc(0, -11, 8, 0, 7); ctx.fill();
  ctx.fillStyle = "#101a17";
  ctx.beginPath(); ctx.arc(Math.cos(p.face) * 3 - 3, -11 + Math.sin(p.face) * 2, 2.6, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(Math.cos(p.face) * 3 + 3, -11 + Math.sin(p.face) * 2, 2.6, 0, 7); ctx.fill();
  ctx.rotate(p.face);
  const sw = p.swing > 0 ? (1 - p.swing / .18) : 0;
  ctx.rotate(p.swing > 0 ? (-0.9 + sw * 1.8) : 0.25);
  ctx.fillStyle = "#9fb0a8";
  ctx.fillRect(10, -2, 22, 4); ctx.fillRect(30, -5, 6, 10);
  ctx.restore();

  if (p.swing > 0) {
    const a = 1 - p.swing / .18;
    ctx.save();
    ctx.globalAlpha = .35 * (1 - a);
    ctx.strokeStyle = "#eaffe0"; ctx.lineWidth = 7;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 42, p.face - 0.9 + a * 1.8 - .5, p.face - 0.9 + a * 1.8 + .5);
    ctx.stroke();
    ctx.restore();
  }
}

function drawParts() {
  for (const q of state.parts) {
    ctx.globalAlpha = clamp(q.life / q.max, 0, 1);
    if (q.text) {
      ctx.fillStyle = q.color;
      ctx.font = `bold ${q.size || 13}px sans-serif`;
      ctx.textAlign = "center";
      ctx.fillText(q.text, q.x, q.y);
    } else {
      ctx.fillStyle = q.color;
      ctx.fillRect(q.x - q.sz / 2, q.y - q.sz / 2, q.sz, q.sz);
    }
  }
  ctx.globalAlpha = 1;
}

function bar(x, y, w, h, ratio, fill) {
  ctx.fillStyle = "rgba(0,0,0,.55)"; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = fill; ctx.fillRect(x, y, w * clamp(ratio, 0, 1), h);
  ctx.strokeStyle = "rgba(255,255,255,.12)"; ctx.lineWidth = 1;
  ctx.strokeRect(x + .5, y + .5, w - 1, h - 1);
}

function drawHUD() {
  const p = state.player, ch = CHAPTERS[state.chapterIdx];
  const hpR = p.hp / stat.maxhp(), fdR = p.hunger / stat.maxfood();

  ctx.fillStyle = "#0a100e"; ctx.fillRect(0, 0, W, HUD_H);
  ctx.fillStyle = "rgba(143,227,192,.14)"; ctx.fillRect(0, HUD_H - 2, W, 2);

  ctx.textAlign = "left"; ctx.font = "11px sans-serif";
  ctx.fillStyle = COL.dim; ctx.fillText("체력", 16, 27);
  bar(56, 17, 186, 13, hpR, hpR < .3 ? "#ff5c5c" : "#4fd18b");
  ctx.fillStyle = COL.dim; ctx.fillText("허기", 16, 52);
  bar(56, 42, 186, 13, fdR, fdR < .25 ? "#ff8a3d" : "#ffd166");

  ctx.textAlign = "right";
  ctx.fillStyle = COL.gem; ctx.font = "bold 19px sans-serif";
  ctx.fillText("◆ " + state.gems, W - 16, 32);
  ctx.fillStyle = COL.text; ctx.font = "bold 14px sans-serif";
  ctx.fillText(String(state.score).padStart(6, "0"), W - 16, 55);

  ctx.fillStyle = "rgba(255,255,255,.05)"; ctx.fillRect(16, 68, W - 32, 26);
  ctx.textAlign = "left"; ctx.font = "bold 12px sans-serif"; ctx.fillStyle = COL.text;
  ctx.fillText(`STAGE ${state.chapterIdx + 1} · ${ch.name}`, 26, 86);
  ctx.textAlign = "right"; ctx.font = "12px sans-serif"; ctx.fillStyle = COL.dim;
  ctx.fillText(ch.kind === "scavenge" ? `보급품 ${p.supplies} / ${ch.need}` : `남은 적 ${state.enemies.length}`, W - 26, 86);
}

function drawOverlays() {
  if (state.toastT > 0) {
    ctx.globalAlpha = clamp(state.toastT, 0, 1);
    ctx.fillStyle = "rgba(6,10,9,.82)";
    ctx.textAlign = "center"; ctx.font = "bold 15px sans-serif";
    const w = ctx.measureText(state.toast).width + 36;
    ctx.fillRect(W / 2 - w / 2, HUD_H + 14, w, 32);
    ctx.fillStyle = COL.text; ctx.fillText(state.toast, W / 2, HUD_H + 35);
    ctx.globalAlpha = 1;
  }
  if (state.flash > 0) { ctx.fillStyle = `rgba(255,120,120,${state.flash * .22})`; ctx.fillRect(0, 0, W, H); }

  const p = state.player;
  if (p && state.scene === "play" && p.hp / stat.maxhp() < .35) {
    const g = ctx.createRadialGradient(W / 2, H / 2, 220, W / 2, H / 2, 640);
    g.addColorStop(0, "rgba(255,0,0,0)");
    g.addColorStop(1, `rgba(180,0,0,${.18 + Math.sin(state.time * 5) * .06})`);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }

  if (state.scene === "bossdown") {
    const t = clamp(state.seqT / 1.4, 0, 1);
    ctx.fillStyle = `rgba(255,255,255,${(1 - t) * .5})`; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = `rgba(0,0,0,${t * .85})`; ctx.fillRect(0, 0, W, H);
    ctx.textAlign = "center"; ctx.globalAlpha = clamp(t * 1.6, 0, 1);
    ctx.fillStyle = COL.hero; ctx.font = "bold 30px sans-serif";
    ctx.fillText("마왕 격파", W / 2, H / 2);
    ctx.globalAlpha = 1;
  }

  if (state.scene === "dead") {
    ctx.fillStyle = "rgba(0,0,0,.8)"; ctx.fillRect(0, 0, W, H);
    ctx.textAlign = "center";
    ctx.fillStyle = "#ff6b6b"; ctx.font = "bold 32px sans-serif";
    ctx.fillText("인류, 완전히 멸종", W / 2, H / 2 - 60);
    ctx.fillStyle = COL.dim; ctx.font = "14px sans-serif";
    ctx.fillText(`STAGE ${state.chapterIdx + 1} · ${CHAPTERS[state.chapterIdx].name} 에서 쓰러졌다`, W / 2, H / 2 - 26);
    ctx.fillStyle = COL.text; ctx.font = "16px sans-serif";
    ctx.fillText(`점수 ${state.score}   ·   처치 ${state.kills}`, W / 2, H / 2 + 14);
    ctx.fillStyle = COL.dim; ctx.font = "13px sans-serif";
    ctx.fillText("최고 점수 " + best, W / 2, H / 2 + 42);
  }

  if (state.fade > 0) { ctx.fillStyle = `rgba(0,0,0,${state.fade})`; ctx.fillRect(0, 0, W, H); }
}

/* 캔버스 버튼 */
function drawButtons() {
  for (const b of sceneButtons()) {
    const on = b.kind === "buy" ? canBuy(b.id) : ready();
    ctx.fillStyle = on ? "rgba(143,227,192,.16)" : "rgba(40,55,50,.25)";
    ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.strokeStyle = on ? "rgba(143,227,192,.6)" : "rgba(80,110,100,.3)";
    ctx.lineWidth = 2; ctx.strokeRect(b.x + 1, b.y + 1, b.w - 2, b.h - 2);
    ctx.textAlign = "center"; ctx.fillStyle = on ? COL.hero : "#4a635a";
    if (b.kind === "buy") {
      const lv = state.up[b.id];
      ctx.font = "bold 15px sans-serif";
      ctx.fillText(lv >= UP_MAX ? "MAX" : "◆ " + UP_COST[lv], b.x + b.w / 2, b.y + b.h / 2 + 5);
    } else {
      ctx.font = "bold 19px sans-serif";
      ctx.fillText(b.kind === "go" ? "출발" : "다시 시작", b.x + b.w / 2, b.y + b.h / 2 + 7);
    }
  }
}

/* ── 타이틀 ── */
function drawTitle() {
  const t = state.time;
  ctx.strokeStyle = "rgba(80,140,120,.05)"; ctx.lineWidth = 1;
  for (let x = 0; x < W; x += TS) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
  for (let y = 0; y < H; y += TS) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }

  ctx.save(); ctx.translate(W / 2, 300);
  for (let i = 4; i >= 0; i--) {
    ctx.globalAlpha = .06 + i * .02; ctx.fillStyle = "#8ce07a";
    ctx.beginPath(); ctx.arc(0, 0, 62 + i * 20 + Math.sin(t * 2 + i) * 5, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
  const R = 62;
  ctx.save();
  ctx.beginPath(); ctx.arc(0, 0, R, 0, 7); ctx.clip();
  const sky = ctx.createLinearGradient(0, -R, 0, R);
  sky.addColorStop(0, "#8fd4ff"); sky.addColorStop(.6, "#d6f1ff");
  ctx.fillStyle = sky; ctx.fillRect(-R, -R, R * 2, R * 2);
  ctx.fillStyle = "#fff6c9";
  ctx.beginPath(); ctx.arc(-R * .5, -R * .5, 11, 0, 7); ctx.fill();
  ctx.fillStyle = "#4ea84c";
  ctx.beginPath(); ctx.moveTo(-R, 8);
  for (let x = -R; x <= R; x += 4) ctx.lineTo(x, 8 + Math.sin(x * .09 + t) * 5);
  ctx.lineTo(R, R); ctx.lineTo(-R, R); ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#6ec95f";
  for (let i = 0; i < 14; i++) ctx.fillRect(-R + i * 9, 22 + Math.sin(t * 2 + i) * 2, 2, 9);
  ctx.restore();
  ctx.strokeStyle = "#dff3ff"; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.arc(0, 0, R, 0, 7); ctx.stroke();
  ctx.globalAlpha = .55; ctx.strokeStyle = "#fff"; ctx.lineWidth = 6;
  ctx.beginPath(); ctx.arc(0, 0, R - 6, -2.6, -1.4); ctx.stroke();
  ctx.globalAlpha = 1;
  ctx.fillStyle = COL.hero;
  const hx = Math.sin(t * 1.2) * 3;
  ctx.fillRect(R - 12 + hx, -6, 13, 16);
  ctx.fillRect(R + 1 + hx, 6, 16, 5);
  ctx.restore();

  ctx.textAlign = "center";
  ctx.fillStyle = COL.dim; ctx.font = "13px sans-serif";
  ctx.fillText("단기 4361년 · 인류의 마지막 생존자", W / 2, 450);
  ctx.fillStyle = COL.hero; ctx.font = "bold 38px sans-serif";
  ctx.fillText("이세계전사 김대원", W / 2, 500);
  ctx.fillStyle = blink() ? "#ffd166" : "#6b5a2e"; ctx.font = "bold 14px sans-serif";
  ctx.fillText("★ 지금 다운로드하세요 ★", W / 2, 530);

  ctx.fillStyle = COL.dim; ctx.font = "13px sans-serif";
  if (touch.on) {
    ctx.fillText("왼쪽 화면을 끌어 이동", W / 2, 610);
    ctx.fillText("오른쪽 [공격] [회피] 버튼", W / 2, 634);
  } else {
    ctx.fillText("이동 WASD·방향키    공격 J·Space", W / 2, 610);
    ctx.fillText("회피 K·Shift", W / 2, 634);
  }
  ctx.fillText("허기가 0이 되면 체력이 깎인다.", W / 2, 672);

  if (best > 0) {
    ctx.fillStyle = COL.food; ctx.font = "bold 15px sans-serif";
    ctx.fillText("최고 점수  " + best, W / 2, 730);
  }
  ctx.fillStyle = blink() ? COL.hero : "#33544a"; ctx.font = "bold 17px sans-serif";
  ctx.fillText(touch.on ? "화면을 탭하여 시작" : "Enter 를 눌러 시작", W / 2, 810);
}

/* ── 스토리 ── */
function drawStory() {
  ctx.fillStyle = "#07090a"; ctx.fillRect(0, 0, W, H);
  const lines = STORY[Math.min(storyIdx, STORY.length - 1)].split("\n");
  ctx.textAlign = "center";
  let y = H / 2 - lines.length * 13;
  for (const ln of lines) {
    ctx.fillStyle = COL.text; ctx.font = "16px sans-serif";
    ctx.fillText(ln, W / 2, y);
    y += 26;
  }
  ctx.fillStyle = "rgba(0,0,0,.18)";
  for (let sy = 0; sy < H; sy += 4) ctx.fillRect(0, sy, W, 1);
  tapPrompt(H - 120);
}

/* 입력 잠금 중에는 흐리게 — 탭이 안 먹는 이유를 보여준다 */
function tapPrompt(y) {
  ctx.textAlign = "center"; ctx.font = "bold 14px sans-serif";
  if (!ready()) { ctx.fillStyle = "#243a34"; ctx.fillText(touch.on ? "화면을 탭하여 계속" : "— Enter —", W / 2, y); return; }
  ctx.fillStyle = blink() ? COL.hero : "#33544a";
  ctx.fillText(touch.on ? "화면을 탭하여 계속" : "— Enter —", W / 2, y);
}

/* ── 스테이지 카드 ── */
function drawCard() {
  const i = state.pendingChapter, ch = CHAPTERS[i];
  ctx.fillStyle = "#07090a"; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = "center";

  ctx.fillStyle = COL.dim; ctx.font = "bold 15px sans-serif";
  ctx.fillText("STAGE " + (i + 1), W / 2, 250);
  ctx.fillStyle = COL.hero; ctx.font = "bold 30px sans-serif";
  ctx.fillText(ch.name, W / 2, 292);

  ctx.strokeStyle = "rgba(143,227,192,.2)"; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(90, 316); ctx.lineTo(W - 90, 316); ctx.stroke();

  ctx.fillStyle = COL.text; ctx.font = "14px sans-serif";
  const goal = ch.kind === "scavenge" ? `보급품 ${ch.need}개를 모아라`
             : ch.kind === "boss"     ? "마왕 현상을 쓰러뜨려라"
             : `적 ${Object.values(ch.spawn).reduce((a, b) => a + b, 0)}마리를 처치하라`;
  ctx.fillText("목표 — " + goal, W / 2, 350);
  ctx.fillStyle = COL.dim; ctx.font = "italic 13px sans-serif";
  ctx.fillText(`"${ch.flavor}"`, W / 2, 382);

  let y = 460;
  for (const t of newEnemiesFor(i)) {
    const d = ENEMY_DEF[t];
    ctx.fillStyle = "rgba(255,209,102,.08)"; ctx.fillRect(50, y - 34, W - 100, 96);
    ctx.strokeStyle = "rgba(255,209,102,.25)"; ctx.lineWidth = 1;
    ctx.strokeRect(50.5, y - 33.5, W - 101, 95);

    ctx.fillStyle = d.color;
    ctx.beginPath(); ctx.arc(90, y + 4, Math.min(d.r, 18), 0, 7); ctx.fill();
    ctx.fillStyle = "#ff4d4d";
    ctx.fillRect(84, y + 1, 4, 3); ctx.fillRect(93, y + 1, 4, 3);

    ctx.textAlign = "left";
    ctx.fillStyle = COL.food; ctx.font = "bold 11px sans-serif";
    ctx.fillText("NEW", 122, y - 10);
    ctx.fillStyle = COL.text; ctx.font = "bold 16px sans-serif";
    ctx.fillText(d.name, 122, y + 10);
    ctx.fillStyle = COL.dim; ctx.font = "12px sans-serif";
    let ly = y + 30;
    for (const ln of CODEX[t].split("\n")) { ctx.fillText(ln, 122, ly); ly += 16; }
    ctx.textAlign = "center";
    y += 116;
  }

  tapPrompt(H - 120);
}

/* ── 상점 ── */
function drawShop() {
  ctx.fillStyle = "#090d0c"; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = "center";
  ctx.fillStyle = COL.hero; ctx.font = "bold 26px sans-serif";
  ctx.fillText("보급 상점", W / 2, 120);
  ctx.fillStyle = COL.dim; ctx.font = "12px sans-serif";
  ctx.fillText("다음 스테이지로 떠나기 전에", W / 2, 146);

  ctx.fillStyle = COL.gem; ctx.font = "bold 22px sans-serif";
  ctx.fillText("◆ " + state.gems, W / 2, 190);

  UPGRADES.forEach((u, i) => {
    const y = SHOP_ROW_Y + i * SHOP_ROW_H;
    const lv = state.up[u.id];
    ctx.fillStyle = "rgba(255,255,255,.03)"; ctx.fillRect(16, y - 34, W - 32, 72);

    ctx.textAlign = "left";
    ctx.fillStyle = COL.text; ctx.font = "bold 16px sans-serif";
    ctx.fillText(u.name, 32, y - 8);
    ctx.fillStyle = COL.dim; ctx.font = "11px sans-serif";
    ctx.fillText(u.eff, 32, y + 10);

    for (let k = 0; k < UP_MAX; k++) {
      ctx.fillStyle = k < lv ? COL.hero : "rgba(143,227,192,.16)";
      ctx.fillRect(32 + k * 18, y + 20, 13, 5);
    }
    ctx.textAlign = "center";
  });

  drawButtons();

  ctx.textAlign = "center"; ctx.fillStyle = COL.dim; ctx.font = "11px sans-serif";
  ctx.fillText(touch.on ? "항목을 눌러 구입 · [출발]로 다음 스테이지" : "클릭하여 구입 · Enter 로 출발", W / 2, H - 48);
  if (state.fade > 0) { ctx.fillStyle = `rgba(0,0,0,${state.fade})`; ctx.fillRect(0, 0, W, H); }
}

/* ── 엔딩 ── */
function drawEnding() {
  ctx.fillStyle = "#07090a"; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = "center";
  ctx.fillStyle = COL.hero; ctx.font = "bold 28px sans-serif";
  ctx.fillText("마왕 현상, 소멸", W / 2, 200);

  const body = [
    "보라색 빛이 꺼지자,",
    "성 밖으로 바람이 불어 들어왔다.",
    "풀냄새였다.",
    "",
    "김대원은 렌치를 내려놓고",
    "들판을 바라본다.",
    "",
    "돌아갈 마트도,",
    "유통기한 지난 통조림도 없다.",
    "",
    "인류의 마지막 생존자는 —",
    "이세계의 첫 번째 전사가 되었다.",
  ];
  ctx.font = "15px sans-serif"; ctx.fillStyle = COL.text;
  let y = 270;
  for (const ln of body) { ctx.fillText(ln, W / 2, y); y += 25; }

  ctx.fillStyle = COL.food; ctx.font = "bold 19px sans-serif";
  ctx.fillText("최종 점수  " + state.score, W / 2, 640);
  ctx.fillStyle = COL.dim; ctx.font = "13px sans-serif";
  ctx.fillText(`처치 ${state.kills}   ·   생존 ${state.runTime.toFixed(1)}초`, W / 2, 666);
  ctx.fillText("최고 점수 " + best, W / 2, 690);
}

/* ─────────────────────────── 루프 ─────────────────────────── */
let last = performance.now();
function loop(now) {
  const dt = Math.min(.05, (now - last) / 1000);
  last = now;
  handleEnter();
  update(state.scene === "bossdown" ? dt * 0.35 : dt);   // 격파 연출은 슬로모션
  draw();
  document.body.classList.toggle("playing", state.scene === "play");
  requestAnimationFrame(loop);
}

newGame();
fitCanvas();
setupInput();
addEventListener("resize", fitCanvas);
draw();
requestAnimationFrame(loop);
})();
</script>
