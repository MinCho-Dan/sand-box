<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

<title>이세계전사 김대원</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    position: fixed; inset: 0;
    background: #07090a;
    display: flex; align-items: center; justify-content: center;
    font-family: "Malgun Gothic", "맑은 고딕", "Apple SD Gothic Neo", sans-serif;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  /* 캔버스 비율 8:5 유지하며 화면에 꽉 차게 */
  #wrap {
    position: relative;
    width: min(100vw, calc(100vh * 1.6));
    height: min(100vh, calc(100vw / 1.6));
    touch-action: none;
  }
  canvas {
    display: block;
    width: 100%; height: 100%;
    background: #0b0f10;
    box-shadow: 0 0 60px rgba(60, 220, 160, .08);
    touch-action: none;
  }
  /* ── 모바일 터치 컨트롤 ── */
  #touch { display: none; }
  body.touch #touch { display: block; }
  /* 플레이 중이 아닐 땐 버튼을 감춰 타이틀·엔딩 화면을 가리지 않는다 */
  body:not(.playing) .btn { display: none; }
  #touch > * { position: absolute; z-index: 5; }

  #stick {
    inset: 0; width: 100%; height: 100%;
    opacity: 0; transition: opacity .12s;
    pointer-events: none;
  }
  #stick.on { opacity: 1; }
  #stick .base, #stick .knob {
    position: absolute; border-radius: 50%; transform: translate(-50%, -50%);
  }
  #stick .base {
    width: 108px; height: 108px;
    border: 2px solid rgba(143, 227, 192, .35);
    background: rgba(10, 24, 20, .35);
  }
  #stick .knob {
    width: 52px; height: 52px;
    background: rgba(143, 227, 192, .5);
    border: 2px solid rgba(223, 243, 255, .6);
  }

  .btn {
    position: absolute;
    border-radius: 50%;
    border: 2px solid rgba(143, 227, 192, .45);
    background: rgba(18, 34, 28, .5);
    color: #cfe8dd;
    font-family: inherit; font-weight: bold;
    display: flex; align-items: center; justify-content: center;
    touch-action: none;
  }
  .btn.press { background: rgba(143, 227, 192, .45); color: #06110d; }
  #btnAtk  { right: 4%;  bottom: 6%;  width: 96px; height: 96px; font-size: 17px; }
  #btnDash { right: 22%; bottom: 24%; width: 74px; height: 74px; font-size: 14px; }

  /* 세로 모드 안내 */
  #rotate {
    display: none;
    position: fixed; inset: 0; z-index: 20;
    background: #07090a; color: #cfe8dd;
    align-items: center; justify-content: center; text-align: center;
    font-size: 17px; line-height: 1.9; padding: 24px;
  }
  body.portrait #rotate { display: flex; }
</style>
<div id="wrap">
  <canvas id="cv" width="960" height="600"></canvas>
  <div id="touch">
    <div id="stick"><div class="base"></div><div class="knob"></div></div>
    <div class="btn" id="btnDash">회피</div>
    <div class="btn" id="btnAtk">공격</div>
  </div>
</div>
<div id="rotate">📱 &nbsp;휴대폰을 <b>가로로</b> 돌려주세요<br><span style="color:#5d7a70;font-size:14px">이세계전사 김대원</span></div>
<script>
(() => {
"use strict";

/* ─────────────────────────── 상수 ─────────────────────────── */
const W = 960, H = 600, TS = 40, MW = 24, MH = 15;
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");

const COL = {
  floor:  "#131a19",
  floor2: "#101615",
  wall:   "#26332e",
  wallTop:"#33443c",
  hero:   "#8fe3c0",
  heroDk: "#3d7f66",
  rift:   "#b06cff",
  danger: "#ff5c5c",
  food:   "#ffd166",
  text:   "#cfe8dd",
  dim:    "#5d7a70",
};

/* ─────────────────────────── 입력 ─────────────────────────── */
const keys = Object.create(null);
let enterEdge = false, attackEdge = false;
addEventListener("keydown", e => {
  if (["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Space"].includes(e.code)) e.preventDefault();
  if (!keys[e.code]) {
    if (e.code === "Enter") enterEdge = true;
    if (e.code === "KeyJ" || e.code === "Space") attackEdge = true;
  }
  keys[e.code] = true;
});
addEventListener("keyup", e => { keys[e.code] = false; });
addEventListener("blur", () => { for (const k in keys) keys[k] = false; });

const down = (...codes) => codes.some(c => keys[c]);

/* ─────────────────────────── 터치 조작 (모바일) ─────────────────────────── */
const touch = { on: false, active: false, x: 0, y: 0, dash: false };

function setupTouch() {
  const wrap  = document.getElementById("wrap");
  const stick = document.getElementById("stick");
  const base  = stick.querySelector(".base");
  const knob  = stick.querySelector(".knob");
  const RAD = 54;
  let stickId = null, ox = 0, oy = 0;

  const enableTouchUI = () => {
    if (touch.on) return;
    touch.on = true;
    document.body.classList.add("touch");
  };
  // 모바일·태블릿이면 처음부터 터치 UI
  if (matchMedia("(pointer: coarse) and (hover: none)").matches) enableTouchUI();

  const place = (dx, dy) => {
    base.style.left = ox + "px"; base.style.top = oy + "px";
    knob.style.left = (ox + dx) + "px"; knob.style.top = (oy + dy) + "px";
  };
  const endStick = () => {
    stickId = null;
    touch.active = false; touch.x = 0; touch.y = 0;
    stick.classList.remove("on");
  };

  wrap.addEventListener("pointerdown", e => {
    if (e.pointerType !== "mouse") enableTouchUI();
    e.preventDefault();
    if (state.scene !== "play") { enterEdge = true; return; }
    if (e.pointerType === "mouse" || stickId !== null) return;
    const r = wrap.getBoundingClientRect();
    if (e.clientX - r.left > r.width * 0.5) return;   // 오른쪽 절반은 버튼 영역
    stickId = e.pointerId;
    try { wrap.setPointerCapture(e.pointerId); } catch (_) {}
    ox = e.clientX - r.left; oy = e.clientY - r.top;
    touch.active = true; touch.x = 0; touch.y = 0;
    stick.classList.add("on");
    place(0, 0);
  });

  wrap.addEventListener("pointermove", e => {
    if (e.pointerId !== stickId) return;
    e.preventDefault();
    const r = wrap.getBoundingClientRect();
    let dx = (e.clientX - r.left) - ox, dy = (e.clientY - r.top) - oy;
    const d = Math.hypot(dx, dy);
    if (d > RAD) { dx = dx / d * RAD; dy = dy / d * RAD; }
    place(dx, dy);
    touch.x = dx / RAD; touch.y = dy / RAD;
  });

  for (const ev of ["pointerup", "pointercancel"]) {
    wrap.addEventListener(ev, e => { if (e.pointerId === stickId) endStick(); });
  }

  const bindBtn = (el, onDown, onUp) => {
    el.addEventListener("pointerdown", e => {
      e.preventDefault(); e.stopPropagation();
      enableTouchUI();
      el.classList.add("press");
      onDown();
    });
    const up = e => { e.preventDefault(); e.stopPropagation(); el.classList.remove("press"); if (onUp) onUp(); };
    for (const ev of ["pointerup", "pointercancel", "pointerleave"]) el.addEventListener(ev, up);
  };
  bindBtn(document.getElementById("btnAtk"),
    () => { if (state.scene === "play") attackEdge = true; else enterEdge = true; });
  bindBtn(document.getElementById("btnDash"),
    () => { if (state.scene === "play") touch.dash = true; else enterEdge = true; },
    () => { touch.dash = false; });

  const checkOrient = () => {
    document.body.classList.toggle("portrait", touch.on && innerHeight > innerWidth);
  };
  addEventListener("resize", checkOrient);
  addEventListener("orientationchange", () => setTimeout(checkOrient, 250));
  checkOrient();
  setInterval(checkOrient, 800);   // 터치 UI가 뒤늦게 켜지는 경우 대비
}

/* 고해상도 화면 대응: 논리 좌표는 960x600 그대로 두고 백버퍼만 키운다 */
function fitCanvas() {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width  = Math.round(W * dpr);
  cv.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.imageSmoothingEnabled = false;
}

/* ─────────────────────────── 유틸 ─────────────────────────── */
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
function angDiff(a, b) {
  let d = (a - b) % (Math.PI * 2);
  if (d > Math.PI) d -= Math.PI * 2;
  if (d < -Math.PI) d += Math.PI * 2;
  return d;
}

/* ─────────────────────────── 챕터 정의 ─────────────────────────── */
const CHAPTERS = [
  { id:0, name:"단기 4361년 · 폐허의 마트", theme:"mart",  kind:"scavenge", need:6 },
  { id:1, name:"이세계 · 싱그러운 들판",     theme:"field", kind:"combat", spawn:{walker:4} },
  { id:2, name:"이세계 · 마수의 숲",         theme:"field", kind:"combat", spawn:{walker:4, spore:5} },
  { id:3, name:"이세계 · 폐성의 회랑",       theme:"stone", kind:"combat", spawn:{walker:3, spore:4, watcher:2} },
  { id:4, name:"마왕성 · 현상(現象)",        theme:"dark",  kind:"boss" },
];

const STORY = [
`단기 4361년.

유례없는 핵전쟁으로 대륙은 잿더미가 되었다.
두 발로 서 있는 생명체는 이제 단 하나.

김대원.

그는 오늘도 빈 마트를 돈다.
유통기한이 지난 통조림, 김빠진 생수.
그것으로 하루를 더 산다.

— Enter —`,
`선반 사이의 공기가 일그러진다.

허공에 동그란 유리창 하나가 떠 있다.
그 너머로, 더는 볼 수 없다고 믿었던
싱그러운 들판이 비친다.

풀냄새. 바람. 살아 있는 초록.

김대원은 렌치를 고쳐 쥐고,
유리창에 손을 댄다 —

— Enter —`,
];

/* ─────────────────────────── 게임 상태 ─────────────────────────── */
let state, story, storyIdx;

function makeMap(chapter) {
  const g = [];
  for (let y = 0; y < MH; y++) {
    g[y] = [];
    for (let x = 0; x < MW; x++) {
      g[y][x] = (x === 0 || y === 0 || x === MW - 1 || y === MH - 1) ? 1 : 0;
    }
  }
  if (chapter.kind === "scavenge") {
    // 마트 진열대: 세로 선반 열
    for (let bx = 3; bx <= MW - 5; bx += 4) {
      for (let y = 2; y < MH - 2; y++) {
        if (y === Math.floor(MH / 2)) continue; // 통로
        g[y][bx] = 1; g[y][bx + 1] = 1;
      }
    }
  } else if (chapter.kind === "boss") {
    // 넓은 공간 + 네 귀퉁이 기둥
    for (const [px, py] of [[5,4],[MW-6,4],[5,MH-5],[MW-6,MH-5]]) {
      g[py][px] = 1; g[py][px+1] = 1; g[py+1][px] = 1; g[py+1][px+1] = 1;
    }
  } else {
    // 무너진 잔해 기둥
    let tries = 0;
    let placed = 0;
    while (placed < 16 && tries++ < 400) {
      const x = Math.floor(rnd(2, MW - 3)), y = Math.floor(rnd(2, MH - 3));
      if (Math.hypot(x - 3, y - Math.floor(MH/2)) < 3) continue; // 시작 지점 확보
      if (g[y][x]) continue;
      g[y][x] = 1;
      placed++;
    }
  }
  return g;
}

function solid(g, tx, ty) {
  if (tx < 0 || ty < 0 || tx >= MW || ty >= MH) return true;
  return g[ty][tx] === 1;
}

function freeSpots(g, minDistFrom, minD) {
  const out = [];
  for (let y = 1; y < MH - 1; y++) for (let x = 1; x < MW - 1; x++) {
    if (g[y][x]) continue;
    const p = { x: x * TS + TS / 2, y: y * TS + TS / 2 };
    if (minDistFrom && dist(p, minDistFrom) < minD) continue;
    out.push(p);
  }
  return out;
}

function newGame() {
  state = {
    scene: "title",      // title | story | play | clear | dead | ending
    chapterIdx: 0,
    time: 0,
    shake: 0, flash: 0, fade: 1,
    kills: 0, score: 0,
    player: {
      x: 3 * TS, y: (MH / 2) * TS, r: 12, face: 0,
      hp: 100, maxhp: 100,
      hunger: 100, maxhunger: 100,
      atkCd: 0, swing: 0, dashCd: 0, dashT: 0, dvx: 0, dvy: 0,
      inv: 0, hurtT: 0, supplies: 0,
    },
    map: null, enemies: [], items: [], bullets: [], parts: [], portal: null,
    toast: "", toastT: 0,
  };
  storyIdx = 0;
}

function loadChapter(i) {
  const ch = CHAPTERS[i];
  const p = state.player;
  state.chapterIdx = i;
  state.map = makeMap(ch);
  state.enemies = []; state.items = []; state.bullets = []; state.parts = [];
  state.portal = null;
  state.fade = 1;
  p.x = 3 * TS; p.y = (MH / 2) * TS;
  p.dashT = 0; p.swing = 0; p.inv = 0.6;

  const spots = freeSpots(state.map, p, 200);
  const take = () => spots.length
    ? spots.splice(Math.floor(Math.random() * spots.length), 1)[0]
    : { x: W / 2, y: H / 2 };

  if (ch.kind === "scavenge") {
    p.supplies = 0;
    const kinds = ["통조림", "생수", "라면", "건빵", "통조림", "생수"];
    for (let k = 0; k < ch.need; k++) {
      const s = take();
      state.items.push({ x: s.x, y: s.y, r: 11, type: "supply", label: kinds[k % kinds.length], t: rnd(0, 6) });
    }
    toast("보급품 " + ch.need + "개를 모아라");
  } else if (ch.kind === "boss") {
    state.enemies.push(makeEnemy("boss", W / 2 + 120, H / 2));
    toast("마왕 현상 — 이세계의 끝");
  } else {
    for (const [type, n] of Object.entries(ch.spawn)) {
      for (let k = 0; k < n; k++) { const s = take(); state.enemies.push(makeEnemy(type, s.x, s.y)); }
    }
    toast("적을 모두 처치하라");
  }
}

function toast(msg) { state.toast = msg; state.toastT = 3.2; }

/* ─────────────────────────── 적 ─────────────────────────── */
const ENEMY_DEF = {
  walker:  { name:"고블린",   hp:34,  spd:58,  r:15, dmg:13, color:"#8a9b4a", score:100 },
  spore:   { name:"슬라임",   hp:16,  spd:118, r:10, dmg:7,  color:"#5fd2c0", score:60  },
  watcher: { name:"흑마법사", hp:46,  spd:42,  r:16, dmg:9,  color:"#5f7fd3", score:180, ranged:true },
  boss:    { name:"마왕 현상", hp:520, spd:46, r:34, dmg:18, color:"#b06cff", score:1500, boss:true },
};
function makeEnemy(type, x, y) {
  const d = ENEMY_DEF[type];
  return { type, x, y, r: d.r, hp: d.hp, maxhp: d.hp, spd: d.spd, hit: 0, cd: rnd(1, 2.5), touch: 0, phase: 0, wob: rnd(0, 6) };
}

/* ─────────────────────────── 충돌 ─────────────────────────── */
function moveEnt(e, dx, dy, g) {
  // 축 분리 이동 + 타일 밀어내기
  e.x += dx;
  resolveAxis(e, g, true);
  e.y += dy;
  resolveAxis(e, g, false);
}
function resolveAxis(e, g, horizontal) {
  const r = e.r;
  const minX = Math.floor((e.x - r) / TS), maxX = Math.floor((e.x + r) / TS);
  const minY = Math.floor((e.y - r) / TS), maxY = Math.floor((e.y + r) / TS);
  for (let ty = minY; ty <= maxY; ty++) for (let tx = minX; tx <= maxX; tx++) {
    if (!solid(g, tx, ty)) continue;
    const L = tx * TS, T = ty * TS, R = L + TS, B = T + TS;
    if (e.x + r <= L || e.x - r >= R || e.y + r <= T || e.y - r >= B) continue;
    if (horizontal) {
      const fromLeft = e.x < L + TS / 2;
      e.x = fromLeft ? L - r : R + r;
    } else {
      const fromTop = e.y < T + TS / 2;
      e.y = fromTop ? T - r : B + r;
    }
  }
}

/* ─────────────────────────── 파티클 ─────────────────────────── */
function burst(x, y, n, color, spd = 160, life = .45) {
  for (let i = 0; i < n; i++) {
    const a = rnd(0, Math.PI * 2), s = rnd(spd * .3, spd);
    state.parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life, max: life, color, sz: rnd(1.5, 3.5) });
  }
}
function popText(x, y, text, color) {
  state.parts.push({ x, y, vx: 0, vy: -34, life: .8, max: .8, color, text });
}

/* ─────────────────────────── 업데이트 ─────────────────────────── */
function update(dt) {
  state.time += dt;
  state.shake = Math.max(0, state.shake - dt * 40);
  state.flash = Math.max(0, state.flash - dt * 3);
  state.fade = Math.max(0, state.fade - dt * 1.6);
  if (state.toastT > 0) state.toastT -= dt;

  if (state.scene !== "play") return;

  const p = state.player, g = state.map, ch = CHAPTERS[state.chapterIdx];

  /* --- 플레이어 이동 --- */
  let ix = (down("KeyD","ArrowRight") ? 1 : 0) - (down("KeyA","ArrowLeft") ? 1 : 0);
  let iy = (down("KeyS","ArrowDown") ? 1 : 0) - (down("KeyW","ArrowUp") ? 1 : 0);
  if (touch.active && (touch.x || touch.y)) { ix = touch.x; iy = touch.y; }
  let len = Math.hypot(ix, iy);
  if (len > 0) p.face = Math.atan2(iy, ix);
  if (len > 1) { ix /= len; iy /= len; len = 1; }   // 아날로그 스틱은 기울기만큼만 속도

  p.atkCd = Math.max(0, p.atkCd - dt);
  p.dashCd = Math.max(0, p.dashCd - dt);
  p.swing = Math.max(0, p.swing - dt);
  p.inv = Math.max(0, p.inv - dt);
  p.hurtT = Math.max(0, p.hurtT - dt);

  // 회피
  if ((down("ShiftLeft","ShiftRight") || touch.dash) && p.dashCd <= 0 && p.dashT <= 0 && len > .15) {
    p.dashT = .18; p.dashCd = .85; p.inv = Math.max(p.inv, .22);
    const dn = Math.hypot(ix, iy) || 1;                 // 살짝 기울여도 회피 거리는 동일
    p.dvx = ix / dn * 520; p.dvy = iy / dn * 520;
    burst(p.x, p.y, 8, COL.heroDk, 90, .3);
  }

  let spd = 178;
  if (p.dashT > 0) {
    p.dashT -= dt;
    moveEnt(p, p.dvx * dt, p.dvy * dt, g);
  } else {
    moveEnt(p, ix * spd * dt, iy * spd * dt, g);
  }

  // 공격
  if (attackEdge && p.atkCd <= 0) {
    p.atkCd = .38; p.swing = .18;
    for (const e of state.enemies) {
      const d = dist(p, e);
      if (d < 52 + e.r && Math.abs(angDiff(Math.atan2(e.y - p.y, e.x - p.x), p.face)) < 1.0) {
        damageEnemy(e, 16, p.face);
      }
    }
    // 근접 총알 쳐내기
    for (let i = state.bullets.length - 1; i >= 0; i--) {
      const b = state.bullets[i];
      if (dist(p, b) < 54 && Math.abs(angDiff(Math.atan2(b.y - p.y, b.x - p.x), p.face)) < 1.0) {
        burst(b.x, b.y, 5, "#fff", 120, .25);
        state.bullets.splice(i, 1);
      }
    }
  }
  attackEdge = false;

  /* --- 허기 --- */
  p.hunger -= dt * 1.5;
  if (p.hunger <= 0) {
    p.hunger = 0;
    hurtPlayer(dt * 5, true);
  }

  /* --- 아이템 --- */
  for (let i = state.items.length - 1; i >= 0; i--) {
    const it = state.items[i];
    it.t += dt;
    if (dist(p, it) < p.r + it.r) {
      state.items.splice(i, 1);
      if (it.type === "supply") {
        p.supplies++;
        p.hunger = clamp(p.hunger + 26, 0, p.maxhunger);
        state.score += 50;
        popText(it.x, it.y, it.label + " 확보", COL.food);
        toast("보급품 " + p.supplies + " / " + ch.need);
      } else if (it.type === "food") {
        p.hunger = clamp(p.hunger + 34, 0, p.maxhunger);
        popText(it.x, it.y, "+허기", COL.food);
      } else if (it.type === "medkit") {
        p.hp = clamp(p.hp + 28, 0, p.maxhp);
        popText(it.x, it.y, "+체력", "#6fe08a");
      }
      burst(it.x, it.y, 8, COL.food, 110, .35);
    }
  }

  /* --- 적 --- */
  for (let i = state.enemies.length - 1; i >= 0; i--) {
    const e = state.enemies[i];
    const d = ENEMY_DEF[e.type];
    e.hit = Math.max(0, e.hit - dt);
    e.touch = Math.max(0, e.touch - dt);
    e.wob += dt;

    const toP = Math.atan2(p.y - e.y, p.x - e.x);
    const dp = dist(p, e);

    if (d.boss) {
      e.cd -= dt;
      const hpRatio = e.hp / e.maxhp;
      const keep = hpRatio < .5 ? 150 : 190;
      let mv = dp > keep ? 1 : -0.5;
      moveEnt(e, Math.cos(toP) * e.spd * mv * dt, Math.sin(toP) * e.spd * mv * dt, g);
      if (e.cd <= 0) {
        e.phase = (e.phase + 1) % 3;
        if (e.phase === 2) {
          // 소환
          for (let k = 0; k < (hpRatio < .5 ? 3 : 2); k++) {
            const a = rnd(0, Math.PI * 2);
            state.enemies.push(makeEnemy("spore", e.x + Math.cos(a) * 46, e.y + Math.sin(a) * 46));
          }
          burst(e.x, e.y, 20, COL.rift, 200, .5);
          e.cd = 3.4;
        } else {
          // 방사형 탄막
          const n = hpRatio < .5 ? 14 : 10;
          const off = rnd(0, Math.PI * 2);
          for (let k = 0; k < n; k++) {
            const a = off + (k / n) * Math.PI * 2;
            state.bullets.push({ x: e.x, y: e.y, vx: Math.cos(a) * 165, vy: Math.sin(a) * 165, r: 6, dmg: 11, life: 4.5 });
          }
          state.shake = 8;
          e.cd = hpRatio < .5 ? 1.5 : 2.1;
        }
      }
    } else if (d.ranged) {
      e.cd -= dt;
      const keep = 190;
      const mv = dp > keep + 30 ? 1 : dp < keep - 40 ? -1 : 0;
      moveEnt(e, Math.cos(toP) * e.spd * mv * dt, Math.sin(toP) * e.spd * mv * dt, g);
      if (e.cd <= 0 && dp < 400) {
        e.cd = 2.0;
        for (let k = -1; k <= 1; k++) {
          const a = toP + k * .18;
          state.bullets.push({ x: e.x, y: e.y, vx: Math.cos(a) * 190, vy: Math.sin(a) * 190, r: 5, dmg: d.dmg, life: 3.5 });
        }
      }
    } else {
      const wob = e.type === "spore" ? Math.sin(e.wob * 6) * .5 : 0;
      const a = toP + wob;
      moveEnt(e, Math.cos(a) * e.spd * dt, Math.sin(a) * e.spd * dt, g);
    }

    // 접촉 피해
    if (dp < p.r + e.r && e.touch <= 0) {
      e.touch = .7;
      hurtPlayer(d.dmg);
      const kb = Math.atan2(p.y - e.y, p.x - e.x);
      moveEnt(p, Math.cos(kb) * 18, Math.sin(kb) * 18, g);
    }

    if (e.hp <= 0) {
      state.enemies.splice(i, 1);
      state.kills++;
      state.score += d.score;
      burst(e.x, e.y, d.boss ? 60 : 16, d.color, d.boss ? 320 : 190, d.boss ? 1.1 : .5);
      state.shake = d.boss ? 22 : 5;
      if (d.boss) state.flash = 1;
      // 드롭
      const roll = Math.random();
      if (!d.boss) {
        if (roll < .22) state.items.push({ x: e.x, y: e.y, r: 10, type: "food", t: 0 });
        else if (roll < .34) state.items.push({ x: e.x, y: e.y, r: 10, type: "medkit", t: 0 });
      }
    }
  }

  /* --- 탄환 --- */
  for (let i = state.bullets.length - 1; i >= 0; i--) {
    const b = state.bullets[i];
    b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
    const tx = Math.floor(b.x / TS), ty = Math.floor(b.y / TS);
    if (b.life <= 0 || solid(g, tx, ty)) {
      burst(b.x, b.y, 5, "#c9a3ff", 80, .25);
      state.bullets.splice(i, 1); continue;
    }
    if (dist(p, b) < p.r + b.r) {
      hurtPlayer(b.dmg);
      burst(b.x, b.y, 7, COL.danger, 120, .3);
      state.bullets.splice(i, 1);
    }
  }

  /* --- 파티클 --- */
  for (let i = state.parts.length - 1; i >= 0; i--) {
    const q = state.parts[i];
    q.x += q.vx * dt; q.y += q.vy * dt;
    q.vx *= .93; q.vy *= .93;
    q.life -= dt;
    if (q.life <= 0) state.parts.splice(i, 1);
  }

  /* --- 클리어 판정 --- */
  if (!state.portal) {
    const done = ch.kind === "scavenge" ? p.supplies >= ch.need : state.enemies.length === 0;
    if (done) {
      if (state.chapterIdx >= CHAPTERS.length - 1) {
        state.scene = "ending";
        state.score += Math.max(0, 3000 - Math.floor(state.time * 10));
      } else {
        const spots = freeSpots(g, p, 120);
        const s = spots.length ? spots[Math.floor(Math.random() * spots.length)] : { x: W / 2, y: H / 2 };
        state.portal = { x: s.x, y: s.y, r: 22, t: 0 };
        state.flash = .8; state.shake = 14;
        toast(ch.kind === "scavenge" ? "…허공에 동그란 유리창이 떠올랐다" : "다음 게이트가 열렸다");
      }
    }
  } else {
    state.portal.t += dt;
    if (dist(p, state.portal) < p.r + state.portal.r) {
      if (state.chapterIdx === 0 && storyIdx < STORY.length) {
        state.scene = "story";  // 두 번째 내레이션
      } else {
        loadChapter(state.chapterIdx + 1);
      }
    }
  }

  if (p.hp <= 0) { state.scene = "dead"; state.shake = 20; }
}

function damageEnemy(e, dmg, dir) {
  e.hp -= dmg;
  e.hit = .12;
  burst(e.x, e.y, 6, "#ffe8b0", 150, .3);
  const g = state.map;
  moveEnt(e, Math.cos(dir) * 12, Math.sin(dir) * 12, g);
  state.shake = Math.max(state.shake, 3);
}

function hurtPlayer(dmg, silent) {
  const p = state.player;
  if (!silent && p.inv > 0) return;
  p.hp -= dmg;
  if (!silent) {
    p.inv = .55; p.hurtT = .25;
    state.shake = 10; state.flash = .5;
    burst(p.x, p.y, 10, COL.danger, 150, .4);
  }
}

/* ─────────────────────────── 렌더 ─────────────────────────── */
function draw() {
  ctx.save();
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = "#0b0f10"; ctx.fillRect(0, 0, W, H);

  if (state.scene === "title")  { drawTitle();  ctx.restore(); return; }
  if (state.scene === "story")  { drawStory();  ctx.restore(); return; }
  if (state.scene === "ending") { drawEnding(); ctx.restore(); return; }

  if (state.shake > 0) ctx.translate(rnd(-state.shake, state.shake) * .4, rnd(-state.shake, state.shake) * .4);

  drawMap();
  drawItems();
  if (state.portal) drawPortal();
  drawEnemies();
  drawBullets();
  drawPlayer();
  drawParts();
  ctx.restore();

  drawHUD();
  drawOverlays();
}

const THEMES = {
  mart:  { f1:COL.floor, f2:COL.floor2, w:COL.wall,  wt:COL.wallTop, deco:null },
  field: { f1:"#1c3520", f2:"#172d1c", w:"#6b5a3a",  wt:"#8f7748",   deco:"grass" },
  stone: { f1:"#2b2a26", f2:"#242320", w:"#4a4740",  wt:"#5f5b51",   deco:"crack" },
  dark:  { f1:"#120f1a", f2:"#0e0c15", w:"#241d33",  wt:"#33294a",   deco:null },
};

function drawMap() {
  const g = state.map;
  const th = THEMES[CHAPTERS[state.chapterIdx].theme] || THEMES.mart;
  for (let y = 0; y < MH; y++) for (let x = 0; x < MW; x++) {
    const px = x * TS, py = y * TS;
    if (g[y][x]) {
      ctx.fillStyle = th.w;
      ctx.fillRect(px, py, TS, TS);
      ctx.fillStyle = th.wt;
      ctx.fillRect(px, py, TS, 7);
      ctx.fillStyle = "rgba(0,0,0,.25)";
      ctx.fillRect(px, py + TS - 4, TS, 4);
    } else {
      ctx.fillStyle = ((x + y) & 1) ? th.f1 : th.f2;
      ctx.fillRect(px, py, TS, TS);
      if (th.deco === "grass" && ((x * 7 + y * 13) % 5 === 0)) {
        ctx.fillStyle = "rgba(150,220,120,.16)";
        const gx = px + ((x * 11 + y * 5) % 26) + 6, gy = py + ((x * 17 + y * 3) % 26) + 8;
        ctx.fillRect(gx, gy, 2, 6); ctx.fillRect(gx + 4, gy + 2, 2, 4);
      } else if (th.deco === "crack" && ((x * 5 + y * 9) % 7 === 0)) {
        ctx.fillStyle = "rgba(0,0,0,.22)";
        ctx.fillRect(px + ((x * 13) % 24) + 4, py + ((y * 7) % 24) + 6, 12, 2);
      }
    }
  }
}

function drawItems() {
  for (const it of state.items) {
    const bob = Math.sin(it.t * 3) * 3;
    ctx.save();
    ctx.translate(it.x, it.y + bob);
    if (it.type === "medkit") {
      ctx.fillStyle = "#f2f6f3"; ctx.fillRect(-8, -7, 16, 14);
      ctx.fillStyle = "#e05555"; ctx.fillRect(-2, -5, 4, 10); ctx.fillRect(-6, -2, 12, 4);
    } else {
      ctx.fillStyle = it.type === "supply" ? COL.food : "#c9a86a";
      ctx.fillRect(-7, -8, 14, 16);
      ctx.fillStyle = "rgba(255,255,255,.35)"; ctx.fillRect(-7, -8, 14, 3);
      ctx.fillStyle = "rgba(0,0,0,.3)"; ctx.fillRect(-7, -1, 14, 2);
    }
    ctx.restore();
    ctx.fillStyle = "rgba(255,209,102,.10)";
    ctx.beginPath(); ctx.arc(it.x, it.y + bob, 16 + Math.sin(it.t * 3) * 2, 0, 7); ctx.fill();
  }
}

function drawPortal() {
  const P = state.portal, t = P.t;
  const glass = state.chapterIdx === 0;   // 마트에서는 '동그란 유리창'
  ctx.save();
  ctx.translate(P.x, P.y);

  // 후광
  for (let i = 3; i >= 0; i--) {
    const r = P.r + i * 9 + Math.sin(t * 3 + i) * 3;
    ctx.globalAlpha = .13 + i * .04;
    ctx.fillStyle = glass ? "#8ce07a" : COL.rift;
    ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;

  if (glass) {
    // 유리창 너머의 싱그러운 들판
    ctx.save();
    ctx.beginPath(); ctx.arc(0, 0, P.r, 0, 7); ctx.clip();
    const sky = ctx.createLinearGradient(0, -P.r, 0, P.r);
    sky.addColorStop(0, "#8fd4ff"); sky.addColorStop(.55, "#cdeeff");
    ctx.fillStyle = sky; ctx.fillRect(-P.r, -P.r, P.r * 2, P.r * 2);
    ctx.fillStyle = "#fff6c9";
    ctx.beginPath(); ctx.arc(-P.r * .45, -P.r * .5, 5, 0, 7); ctx.fill();
    ctx.fillStyle = "#4ea84c";
    ctx.beginPath();
    ctx.moveTo(-P.r, P.r * .1);
    for (let x = -P.r; x <= P.r; x += 4) ctx.lineTo(x, P.r * .1 + Math.sin(x * .12 + t) * 3);
    ctx.lineTo(P.r, P.r); ctx.lineTo(-P.r, P.r); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#6ec95f";
    for (let i = 0; i < 7; i++) {
      const gx = -P.r + ((i * 13 + Math.sin(t + i) * 2) % (P.r * 2));
      ctx.fillRect(gx, P.r * .2, 2, 7);
    }
    ctx.restore();
    // 유리 테두리 + 반사광
    ctx.strokeStyle = "#dff3ff"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(0, 0, P.r, 0, 7); ctx.stroke();
    ctx.globalAlpha = .5; ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(0, 0, P.r - 4, -2.5, -1.5); ctx.stroke();
    ctx.globalAlpha = 1;
  } else {
    ctx.rotate(t * 1.6);
    ctx.strokeStyle = "#e0c2ff"; ctx.lineWidth = 3;
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
      const a = (i / 6) * Math.PI * 2;
      const r = P.r * (i % 2 ? .55 : 1);
      const x = Math.cos(a) * r, y = Math.sin(a) * r;
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    ctx.closePath(); ctx.stroke();
  }
  ctx.restore();

  ctx.fillStyle = COL.text; ctx.font = "12px sans-serif"; ctx.textAlign = "center";
  ctx.fillText(glass ? "손을 대기" : "게이트로 들어가기", P.x, P.y + P.r + 26);
}

function drawEnemies() {
  for (const e of state.enemies) {
    const d = ENEMY_DEF[e.type];
    ctx.save();
    ctx.translate(e.x, e.y);
    const wob = Math.sin(e.wob * 7) * 2;

    if (d.boss) {
      ctx.globalAlpha = .18; ctx.fillStyle = COL.rift;
      ctx.beginPath(); ctx.arc(0, 0, e.r + 22 + Math.sin(e.wob * 2) * 6, 0, 7); ctx.fill();
      ctx.globalAlpha = 1;
    }
    ctx.fillStyle = e.hit > 0 ? "#ffffff" : d.color;
    ctx.beginPath(); ctx.arc(0, wob * .4, e.r, 0, 7); ctx.fill();
    // 눈
    ctx.fillStyle = e.hit > 0 ? "#333" : "#ff4d4d";
    const ey = e.r * .18;
    ctx.fillRect(-e.r * .45, ey - 2, e.r * .3, 3);
    ctx.fillRect(e.r * .15, ey - 2, e.r * .3, 3);
    // 다리 느낌
    ctx.fillStyle = "rgba(0,0,0,.35)";
    ctx.fillRect(-e.r * .6, e.r - 2, e.r * 1.2, 3);
    ctx.restore();

    // 체력바
    if (e.hp < e.maxhp) {
      const w = d.boss ? 90 : e.r * 2.2;
      ctx.fillStyle = "rgba(0,0,0,.6)"; ctx.fillRect(e.x - w / 2, e.y - e.r - 12, w, 4);
      ctx.fillStyle = d.boss ? COL.rift : "#e06060";
      ctx.fillRect(e.x - w / 2, e.y - e.r - 12, w * clamp(e.hp / e.maxhp, 0, 1), 4);
    }
  }
}

function drawBullets() {
  for (const b of state.bullets) {
    ctx.fillStyle = "#e3c8ff";
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 7); ctx.fill();
    ctx.globalAlpha = .3; ctx.fillStyle = COL.rift;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r + 4, 0, 7); ctx.fill();
    ctx.globalAlpha = 1;
  }
}

function drawPlayer() {
  const p = state.player;
  ctx.save();
  ctx.translate(p.x, p.y);
  // 그림자
  ctx.fillStyle = "rgba(0,0,0,.35)";
  ctx.beginPath(); ctx.ellipse(0, p.r - 1, p.r * .9, p.r * .35, 0, 0, 7); ctx.fill();

  if (p.inv > 0 && Math.floor(p.inv * 20) % 2 === 0) ctx.globalAlpha = .45;

  // 몸
  ctx.fillStyle = p.hurtT > 0 ? "#ffffff" : "#2f4b41";
  ctx.fillRect(-9, -6, 18, 16);
  // 머리
  ctx.fillStyle = p.hurtT > 0 ? "#ffffff" : COL.hero;
  ctx.beginPath(); ctx.arc(0, -11, 8, 0, 7); ctx.fill();
  // 방독면 렌즈
  ctx.fillStyle = "#101a17";
  ctx.beginPath(); ctx.arc(Math.cos(p.face) * 3 - 3, -11 + Math.sin(p.face) * 2, 2.6, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(Math.cos(p.face) * 3 + 3, -11 + Math.sin(p.face) * 2, 2.6, 0, 7); ctx.fill();

  // 렌치
  ctx.rotate(p.face);
  const sw = p.swing > 0 ? (1 - p.swing / .18) : 0;
  const wa = p.swing > 0 ? (-0.9 + sw * 1.8) : 0.25;
  ctx.rotate(wa);
  ctx.fillStyle = "#9fb0a8";
  ctx.fillRect(10, -2, 22, 4);
  ctx.fillRect(30, -5, 6, 10);
  ctx.restore();

  // 스윙 잔상
  if (p.swing > 0) {
    const a = 1 - p.swing / .18;
    ctx.save();
    ctx.globalAlpha = .35 * (1 - a);
    ctx.strokeStyle = "#eaffe0"; ctx.lineWidth = 7;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 44, p.face - 0.9 + a * 1.8 - .5, p.face - 0.9 + a * 1.8 + .5);
    ctx.stroke();
    ctx.restore();
  }
}

function drawParts() {
  for (const q of state.parts) {
    const a = clamp(q.life / q.max, 0, 1);
    ctx.globalAlpha = a;
    if (q.text) {
      ctx.fillStyle = q.color; ctx.font = "bold 13px sans-serif"; ctx.textAlign = "center";
      ctx.fillText(q.text, q.x, q.y);
    } else {
      ctx.fillStyle = q.color;
      ctx.fillRect(q.x - q.sz / 2, q.y - q.sz / 2, q.sz, q.sz);
    }
  }
  ctx.globalAlpha = 1;
}

function bar(x, y, w, h, ratio, fill, back) {
  ctx.fillStyle = back || "rgba(0,0,0,.55)"; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = fill; ctx.fillRect(x, y, w * clamp(ratio, 0, 1), h);
  ctx.strokeStyle = "rgba(255,255,255,.12)"; ctx.lineWidth = 1;
  ctx.strokeRect(x + .5, y + .5, w - 1, h - 1);
}

function drawHUD() {
  const p = state.player, ch = CHAPTERS[state.chapterIdx];
  ctx.fillStyle = "rgba(6,10,9,.72)"; ctx.fillRect(0, 0, W, 52);
  ctx.textAlign = "left";

  ctx.fillStyle = COL.dim; ctx.font = "11px sans-serif";
  ctx.fillText("체력", 16, 18);
  bar(48, 9, 190, 11, p.hp / p.maxhp, p.hp / p.maxhp < .3 ? "#ff5c5c" : "#4fd18b");
  ctx.fillStyle = COL.dim;
  ctx.fillText("허기", 16, 38);
  bar(48, 29, 190, 11, p.hunger / p.maxhunger, p.hunger / p.maxhunger < .25 ? "#ff8a3d" : "#ffd166");

  ctx.fillStyle = COL.text; ctx.font = "bold 14px sans-serif";
  ctx.fillText(ch.name, 266, 21);
  ctx.fillStyle = COL.dim; ctx.font = "12px sans-serif";
  const objective = ch.kind === "scavenge"
    ? `보급품 ${p.supplies} / ${ch.need}`
    : `남은 적 ${state.enemies.length}`;
  ctx.fillText(objective, 266, 39);

  ctx.textAlign = "right";
  ctx.fillStyle = COL.text; ctx.font = "bold 15px sans-serif";
  ctx.fillText("SCORE  " + String(state.score).padStart(6, "0"), W - 16, 21);
  ctx.fillStyle = COL.dim; ctx.font = "12px sans-serif";
  ctx.fillText("처치 " + state.kills + "   경과 " + state.time.toFixed(0) + "초", W - 16, 39);

  // 회피·공격 쿨다운 표시 (터치 기기는 화면 버튼이 있으므로 생략)
  if (!touch.on) {
    ctx.textAlign = "left";
    ctx.fillStyle = p.dashCd <= 0 ? "#8fe3c0" : "#3a544b";
    ctx.font = "11px sans-serif";
    ctx.fillText("[Shift] 회피", 16, H - 14);
    ctx.fillStyle = p.atkCd <= 0 ? "#8fe3c0" : "#3a544b";
    ctx.fillText("[J/Space] 렌치", 96, H - 14);
  }
}

function drawOverlays() {
  if (state.toastT > 0) {
    const a = clamp(state.toastT, 0, 1);
    ctx.globalAlpha = a;
    ctx.fillStyle = "rgba(6,10,9,.8)";
    ctx.textAlign = "center"; ctx.font = "bold 18px sans-serif";
    const w = ctx.measureText(state.toast).width + 44;
    ctx.fillRect(W / 2 - w / 2, 66, w, 34);
    ctx.fillStyle = COL.text;
    ctx.fillText(state.toast, W / 2, 89);
    ctx.globalAlpha = 1;
  }

  if (state.flash > 0) {
    ctx.fillStyle = `rgba(255,120,120,${state.flash * .22})`;
    ctx.fillRect(0, 0, W, H);
  }
  if (state.fade > 0) {
    ctx.fillStyle = `rgba(0,0,0,${state.fade})`;
    ctx.fillRect(0, 0, W, H);
  }
  // 저체력 비네트
  const p = state.player;
  if (p && p.hp / p.maxhp < .35) {
    const g2 = ctx.createRadialGradient(W / 2, H / 2, 200, W / 2, H / 2, 560);
    const pulse = .18 + Math.sin(state.time * 5) * .06;
    g2.addColorStop(0, "rgba(255,0,0,0)");
    g2.addColorStop(1, `rgba(180,0,0,${pulse})`);
    ctx.fillStyle = g2; ctx.fillRect(0, 0, W, H);
  }

  if (state.scene === "dead") {
    ctx.fillStyle = "rgba(0,0,0,.78)"; ctx.fillRect(0, 0, W, H);
    ctx.textAlign = "center";
    ctx.fillStyle = "#ff6b6b"; ctx.font = "bold 44px sans-serif";
    ctx.fillText("인류, 완전히 멸종", W / 2, H / 2 - 30);
    ctx.fillStyle = COL.dim; ctx.font = "15px sans-serif";
    ctx.fillText(CHAPTERS[state.chapterIdx].name + " 에서 쓰러졌다", W / 2, H / 2 + 6);
    ctx.fillStyle = COL.text; ctx.font = "16px sans-serif";
    ctx.fillText("최종 점수 " + state.score + "   ·   처치 " + state.kills, W / 2, H / 2 + 40);
    ctx.fillStyle = blink() ? COL.hero : COL.dim; ctx.font = "14px sans-serif";
    ctx.fillText(touch.on ? "화면을 탭하여 다시 시작" : "Enter — 다시 시작", W / 2, H / 2 + 84);
  }
}

function blink() { return Math.floor(state.time * 2) % 2 === 0; }

function drawTitle() {
  const t = state.time;
  // 배경 그리드
  ctx.strokeStyle = "rgba(80,140,120,.06)"; ctx.lineWidth = 1;
  for (let x = 0; x < W; x += 40) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
  for (let y = 0; y < H; y += 40) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }

  // 허공에 뜬 동그란 유리창
  ctx.save();
  ctx.translate(W / 2, 190);
  for (let i = 4; i >= 0; i--) {
    ctx.globalAlpha = .06 + i * .02;
    ctx.fillStyle = "#8ce07a";
    ctx.beginPath(); ctx.arc(0, 0, 62 + i * 20 + Math.sin(t * 2 + i) * 5, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
  const R = 62;
  ctx.save();
  ctx.beginPath(); ctx.arc(0, 0, R, 0, 7); ctx.clip();
  const sky = ctx.createLinearGradient(0, -R, 0, R);
  sky.addColorStop(0, "#8fd4ff"); sky.addColorStop(.6, "#d6f1ff");
  ctx.fillStyle = sky; ctx.fillRect(-R, -R, R * 2, R * 2);
  ctx.fillStyle = "#fff6c9";
  ctx.beginPath(); ctx.arc(-R * .5, -R * .5, 11, 0, 7); ctx.fill();
  ctx.fillStyle = "#4ea84c";
  ctx.beginPath(); ctx.moveTo(-R, 8);
  for (let x = -R; x <= R; x += 4) ctx.lineTo(x, 8 + Math.sin(x * .09 + t) * 5);
  ctx.lineTo(R, R); ctx.lineTo(-R, R); ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#6ec95f";
  for (let i = 0; i < 14; i++) ctx.fillRect(-R + i * 9, 22 + Math.sin(t * 2 + i) * 2, 2, 9);
  ctx.restore();
  ctx.strokeStyle = "#dff3ff"; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.arc(0, 0, R, 0, 7); ctx.stroke();
  ctx.globalAlpha = .55; ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 6;
  ctx.beginPath(); ctx.arc(0, 0, R - 6, -2.6, -1.4); ctx.stroke();
  ctx.globalAlpha = 1;
  // 유리창에 닿는 손
  ctx.fillStyle = COL.hero;
  const hx = Math.sin(t * 1.2) * 3;
  ctx.fillRect(R - 12 + hx, -6, 13, 16);
  ctx.fillRect(R + 1 + hx, 6, 16, 5);
  ctx.restore();

  ctx.textAlign = "center";
  ctx.fillStyle = COL.dim; ctx.font = "14px sans-serif";
  ctx.fillText("단기 4361년 · 인류의 마지막 생존자", W / 2, 300);

  ctx.fillStyle = COL.hero; ctx.font = "bold 58px sans-serif";
  ctx.fillText("이세계전사 김대원", W / 2, 358);
  ctx.strokeStyle = "rgba(176,108,255,.35)"; ctx.lineWidth = 1;
  ctx.strokeText("이세계전사 김대원", W / 2 + 2, 360);

  ctx.fillStyle = blink() ? "#ffd166" : "#6b5a2e"; ctx.font = "bold 15px sans-serif";
  ctx.fillText("★ 지금 다운로드하세요 ★", W / 2, 392);

  ctx.fillStyle = COL.dim; ctx.font = "13px sans-serif";
  ctx.fillText(touch.on ? "왼쪽 화면을 끌어 이동    오른쪽 [공격] [회피] 버튼"
                        : "이동 WASD·방향키    공격 J·Space    회피 Shift", W / 2, 436);
  ctx.fillText("허기가 0이 되면 체력이 깎인다. 통조림을 놓치지 마라.", W / 2, 460);

  ctx.fillStyle = blink() ? COL.hero : "#33544a"; ctx.font = "bold 18px sans-serif";
  ctx.fillText(GO_MSG(), W / 2, 522);
}

const GO_MSG = () => touch.on ? "화면을 탭하여 시작" : "Enter 를 눌러 시작";
const NEXT_MSG = () => touch.on ? "화면을 탭하여 계속" : "— Enter —";

function drawStory() {
  ctx.fillStyle = "#07090a"; ctx.fillRect(0, 0, W, H);
  const lines = STORY[Math.min(storyIdx, STORY.length - 1)].split("\n");
  ctx.textAlign = "center";
  let y = H / 2 - lines.length * 13;
  for (const ln of lines) {
    const last = ln.trim().startsWith("—");
    ctx.fillStyle = last ? (blink() ? COL.hero : "#2f4a41") : COL.text;
    ctx.font = last ? "bold 15px sans-serif" : "17px sans-serif";
    ctx.fillText(last ? NEXT_MSG() : ln, W / 2, y);
    y += 27;
  }
  // 스캔라인
  ctx.fillStyle = "rgba(0,0,0,.18)";
  for (let sy = 0; sy < H; sy += 4) ctx.fillRect(0, sy, W, 1);
}

function drawEnding() {
  ctx.fillStyle = "#07090a"; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = "center";
  ctx.fillStyle = COL.hero; ctx.font = "bold 34px sans-serif";
  ctx.fillText("마왕 현상, 소멸", W / 2, 150);

  const body = [
    "보라색 빛이 꺼지자, 성 밖으로 바람이 불어 들어왔다.",
    "풀냄새였다.",
    "",
    "김대원은 렌치를 내려놓고 들판을 바라본다.",
    "돌아갈 마트도, 유통기한 지난 통조림도 없다.",
    "",
    "인류의 마지막 생존자는 —",
    "이세계의 첫 번째 전사가 되었다.",
  ];
  ctx.font = "17px sans-serif";
  let y = 220;
  for (const ln of body) { ctx.fillStyle = COL.text; ctx.fillText(ln, W / 2, y); y += 28; }

  ctx.fillStyle = COL.food; ctx.font = "bold 20px sans-serif";
  ctx.fillText("최종 점수  " + state.score, W / 2, 470);
  ctx.fillStyle = COL.dim; ctx.font = "14px sans-serif";
  ctx.fillText("처치 " + state.kills + "   ·   생존 " + state.time.toFixed(1) + "초", W / 2, 496);

  ctx.fillStyle = blink() ? COL.hero : "#33544a"; ctx.font = "bold 16px sans-serif";
  ctx.fillText(touch.on ? "화면을 탭하여 다시 시작" : "Enter — 다시 시작", W / 2, 550);
}

/* ─────────────────────────── 씬 전환 ─────────────────────────── */
function handleEnter() {
  if (!enterEdge) return;
  enterEdge = false;
  if (state.scene === "title") {
    state.scene = "story"; storyIdx = 0; state.fade = 1;
  } else if (state.scene === "story") {
    storyIdx++;
    state.fade = 1;
    if (storyIdx === 1) {
      loadChapter(0);
      state.scene = "play";
    } else {
      loadChapter(1);
      state.scene = "play";
    }
  } else if (state.scene === "dead" || state.scene === "ending") {
    newGame();
  }
}

/* ─────────────────────────── 루프 ─────────────────────────── */
let last = performance.now();
function loop(now) {
  const dt = Math.min(.05, (now - last) / 1000);
  last = now;
  handleEnter();
  enterEdge = false;
  update(dt);
  draw();
  document.body.classList.toggle("playing", state.scene === "play");
  requestAnimationFrame(loop);
}

newGame();
fitCanvas();
setupTouch();
addEventListener("resize", fitCanvas);
draw();                      // 탭이 백그라운드여도 타이틀은 즉시 한 번 그린다
requestAnimationFrame(loop);
})();
</script>
